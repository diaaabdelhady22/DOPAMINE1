<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>DOPAMINE — Chemistry Learning Platform</title>
  <meta name="description" content="DOPAMINE chemistry learning platform with Mr. Ahmed Dorar.">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    :root{
      --navy:#132238;--navy-2:#1d304a;--orange:#f47b20;--orange-dark:#d9630c;
      --bg:#f8f9fb;--white:#fff;--line:#e7ebf0;--muted:#687588;--soft:#f1f3f5;--surface:#fff;--surface-2:#f1f3f5;--input:#fff;--text:#132238;
      --success:#16835b;--danger:#c63d3d;--shadow:0 14px 40px rgba(20,38,61,.08);
      --radius:16px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--navy);background:var(--bg)}
    body{overflow-x:hidden}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    img{max-width:100%}
    .app{min-height:100vh}
    .site-header{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;z-index:50}
    .header-inner{width:min(1180px,calc(100% - 36px));margin:auto;display:flex;align-items:center;justify-content:space-between;gap:22px}
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .brand img{width:170px;height:auto;display:block}
    .brand-name{display:none}
    .nav{display:flex;align-items:center;gap:5px}
    .nav button{border:0;background:transparent;color:#566477;padding:10px 12px;border-radius:9px;font-weight:600}
    .nav button:hover{background:var(--soft);color:var(--navy)}
    .nav .primary{background:var(--orange);color:#fff;padding:11px 17px}
    .nav .primary:hover{background:var(--orange-dark);color:#fff}
    .mobile-menu{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;position:relative;overflow:hidden}
    .mobile-menu .mi{transition:transform .24s ease,opacity .18s ease}
    .mobile-menu.open .mi{transform:rotate(90deg)}
    .mobile-nav{display:none;position:absolute;top:75px;left:0;right:0;background:#fff;border-bottom:1px solid var(--line);padding:10px 18px 15px;box-shadow:0 10px 25px rgba(20,38,61,.07);opacity:0;visibility:hidden;transform:translateY(-10px);pointer-events:none;transition:opacity .24s ease,transform .28s cubic-bezier(.22,.61,.36,1),visibility .24s ease}
    .mobile-nav.open{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}
    .mobile-nav button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:13px 9px;border-radius:8px;color:var(--navy);opacity:0;transform:translateY(-5px);transition:opacity .2s ease,transform .24s ease,background .18s ease}
    .mobile-nav.open button{opacity:1;transform:translateY(0)}
    .mobile-nav.open button:nth-child(1){transition-delay:.02s}.mobile-nav.open button:nth-child(2){transition-delay:.045s}.mobile-nav.open button:nth-child(3){transition-delay:.07s}.mobile-nav.open button:nth-child(4){transition-delay:.095s}.mobile-nav.open button:nth-child(5){transition-delay:.12s}
    .mobile-nav button:hover{background:var(--soft)}

    .notifications-list{display:grid;gap:10px;max-width:900px;margin:24px auto 0 0}.notification-item{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 6px 18px rgba(20,38,61,.04)}.notification-icon{width:42px;height:42px;border-radius:11px;background:#fff3e9;color:var(--orange);display:grid;place-items:center;flex:none}.notification-icon.is-error{background:#fff0f0;color:var(--danger)}.notification-icon.is-success{background:#eefaf5;color:var(--success)}.notification-copy strong{display:block;font-size:15px;margin-bottom:4px}.notification-copy p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.notification-copy small{display:block;margin-top:8px;color:var(--muted);font-size:11px}@media(max-width:700px){.notifications-list{margin-top:18px}.notification-item{padding:14px}.notification-icon{width:38px;height:38px}.notification-copy strong{font-size:14px}}

    /* About teacher */
    .teacher-about{display:grid;grid-template-columns:minmax(320px,.9fr) minmax(0,1.1fr);gap:62px;align-items:center;margin-top:28px}
    .teacher-photo-wrap{position:relative;min-height:455px;display:flex;align-items:flex-end;justify-content:center}
    .teacher-photo-circle{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:430px;height:430px;border-radius:50%;background:var(--orange);box-shadow:0 22px 50px rgba(244,123,32,.20);z-index:1}
    .teacher-photo-mask{position:absolute;z-index:2;left:50%;bottom:0;transform:translateX(-50%);width:430px;height:430px;border-radius:50%;overflow:hidden}
    .teacher-photo{position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);width:400px;height:auto;display:block;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 16px 18px rgba(20,25,35,.14))}
    .teacher-photo-over{position:absolute;z-index:3;left:50%;bottom:0;transform:translateX(-50%);width:315px;height:auto;display:block;clip-path:inset(0 0 84% 0);display:none;filter:drop-shadow(0 16px 18px rgba(20,25,35,.14))}
    .teacher-copy{position:relative;z-index:3}
    .teacher-copy h2{font-size:36px;letter-spacing:-.035em;margin:7px 0 15px}
    .teacher-copy p{font-size:16px;line-height:1.85;color:var(--muted);margin:0 0 14px}
    .teacher-points{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
    .teacher-point{display:flex;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
    .teacher-point .mi{color:var(--orange);font-size:21px}
    .teacher-point span:last-child{font-size:13px;font-weight:750}
    .page-view{display:none;min-height:calc(100vh - 76px)}
    .page-view.active{display:block}
    .container{width:min(1180px,calc(100% - 36px));margin:auto}
    .btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;transition:.18s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    .btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:var(--orange-dark);transform:translateY(-1px)}
    .btn-secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn-secondary:hover{background:var(--soft)}
    .btn-danger{background:#fff;color:var(--danger);border:1px solid #f0d7d7}
    .eyebrow{color:var(--orange);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
    .muted{color:var(--muted)}
    .notice{padding:12px 14px;border-radius:10px;font-size:14px;margin-bottom:15px;display:none}
    .notice.error{display:block;background:#fff0f0;color:var(--danger);border:1px solid #f3d3d3}
    .notice.success{display:block;background:#eefaf5;color:var(--success);border:1px solid #cdeedf}
    .loading{padding:45px;text-align:center;color:var(--muted)}
    .spinner{width:25px;height:25px;border:3px solid #e7ebf0;border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
    @keyframes spin{to{transform:rotate(360deg)}}


    /* Animated teacher portrait on the landing page */
    .hero-layout{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(300px,.82fr);align-items:center;gap:30px;min-height:calc(100vh - 76px)}
    .hero-layout .hero-copy{width:100%;padding:70px 0 78px}
    .hero-teacher-visual{position:relative;display:block;width:min(100%,430px);aspect-ratio:1;margin:0 auto;border:0;background:transparent;padding:0;isolation:isolate;cursor:pointer;transform:translateZ(0)}
    .hero-blob{position:absolute;inset:8% 7% 7%;display:block;overflow:hidden;background:linear-gradient(145deg,#ffb16f,#f47b20 62%,#dc650e);border-radius:38% 62% 58% 42% / 43% 39% 61% 57%;animation:blobMorph 8s ease-in-out infinite;box-shadow:0 25px 70px rgba(244,123,32,.22);transition:border-radius .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}
    .hero-blob:before{content:"";position:absolute;inset:12px;border:1px solid rgba(255,255,255,.32);border-radius:inherit;z-index:2;pointer-events:none}
    .hero-blob img{position:absolute;left:50%;bottom:-1%;height:94%;width:94%;max-width:none;object-fit:contain;object-position:center bottom;transform:translateX(-50%);filter:drop-shadow(0 12px 18px rgba(39,30,22,.15));transition:none}
    .hero-orbit{position:absolute;border:1px solid rgba(244,123,32,.25);border-radius:50%;inset:0;pointer-events:none}
    .orbit-one{transform:rotate(-23deg) scaleX(.78)}
    .orbit-two{inset:13% -3%;transform:rotate(48deg) scaleX(.76);border-style:dashed}
    .hero-visual-caption{position:absolute;z-index:3;right:-1%;bottom:9%;display:flex;align-items:center;gap:11px;text-align:left;padding:13px 16px;background:rgba(255,255,255,.94);border:1px solid rgba(231,235,240,.9);border-radius:14px;box-shadow:0 12px 35px rgba(19,34,56,.12);color:#132238;backdrop-filter:blur(10px)}
    .hero-visual-caption strong,.hero-visual-caption small{display:block}.hero-visual-caption strong{font-size:13px}.hero-visual-caption small{font-size:11px;color:#687588;margin-top:3px}.hero-visual-caption>i{color:#f47b20;font-size:13px;margin-left:5px}.caption-dot{width:8px;height:8px;background:#f47b20;border-radius:50%;box-shadow:0 0 0 5px rgba(244,123,32,.12)}
    @keyframes blobMorph{0%,100%{border-radius:38% 62% 58% 42% / 43% 39% 61% 57%}33%{border-radius:54% 46% 40% 60% / 56% 37% 63% 44%}66%{border-radius:43% 57% 64% 36% / 39% 57% 43% 61%}}
    @keyframes blobFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
    @keyframes orbitSpin{to{rotate:360deg}}
    .hero-teacher-visual:hover .hero-blob{transform:scale(1.025)}
    .teacher-about .teacher-photo-circle,.teacher-about .teacher-photo-mask{transition:border-radius .7s ease,transform .7s ease}
    .teacher-about .teacher-photo-circle{animation:aboutCircleIn .75s cubic-bezier(.2,.8,.2,1) both}
    .teacher-about .teacher-photo-mask{animation:aboutCircleIn .75s cubic-bezier(.2,.8,.2,1) both}
    .teacher-copy{animation:aboutCopyIn .65s .18s ease both}
    @keyframes aboutCircleIn{from{opacity:.4;transform:translateX(-50%) scale(.82)}to{opacity:1;transform:translateX(-50%) scale(1)}}
    @keyframes aboutCopyIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
    @media(max-width:900px){.hero-layout{grid-template-columns:minmax(0,1fr) minmax(230px,.72fr);gap:12px}.hero-teacher-visual{width:100%}.hero-visual-caption{right:-2%;bottom:5%;padding:10px 12px}}
    @media(max-width:700px){.hero-layout{display:flex;flex-direction:column;gap:0;min-height:0}.hero-layout .hero-copy{padding:25px 0 22px}.hero-teacher-visual{display:none!important}.hero-layout .hero-copy{order:1}}
    @media(prefers-reduced-motion:reduce){.hero-blob,.hero-orbit,.teacher-about .teacher-photo-circle,.teacher-about .teacher-photo-mask,.teacher-copy{animation:none!important;transition:none!important}}

    /* Public landing */
    .hero{position:relative;overflow:hidden;background:#fff;min-height:calc(100vh - 76px);display:flex;align-items:center}
    .hero-copy{position:relative;z-index:2;width:min(720px,100%);padding:76px 0 92px}
    .hero h1{font-size:clamp(44px,7vw,78px);line-height:.98;letter-spacing:-.055em;margin:13px 0 22px;max-width:700px}
    .hero h1 span{color:var(--orange)}
    .hero p{font-size:18px;line-height:1.75;color:#5d6b7d;max-width:650px;margin:0 0 28px}
    .hero-actions{display:flex;gap:10px;flex-wrap:wrap}
    /* Dense chemistry icon field, behind the hero content */
    .word-cloud{
      position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;
      display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(38px,5.1vw,70px),1fr));
      grid-auto-rows:clamp(42px,5.5vw,74px);gap:0;padding:0;
      opacity:.20;align-content:center;
      background:radial-gradient(ellipse at 55% 45%,rgba(244,123,32,.11),transparent 68%);
      mask-image:linear-gradient(to bottom,#000 0%,#000 90%,transparent 100%);
    }
    .word-cloud span{display:flex;align-items:center;justify-content:center;min-width:0;
      color:#6b7d91;font-weight:700;white-space:nowrap;line-height:1;
      transform:rotate(var(--tilt));animation:none;overflow:hidden;}
    .word-cloud .chem-icon{width:100%;height:100%;border:0;border-radius:0;background:transparent;
      color:#ed7b22;font-size:clamp(21px,2.4vw,34px);}
    .word-cloud .chem-formula{font-family:Georgia,serif;color:#29445f;
      background:transparent;padding:0;border:0;border-radius:0;font-size:clamp(12px,1.45vw,20px);}
    .word-cloud span:nth-child(3n){color:#e47b28}
    .word-cloud .chem-icon i{font-size:inherit}
    html[data-theme="dark"] .word-cloud span{color:#dce8f5}
    html[data-theme="dark"] .word-cloud .chem-icon{background:transparent;color:#ff922f}
    html[data-theme="dark"] .word-cloud .chem-formula{background:transparent;border:0}
    .hero>.container{position:relative;z-index:2}
    .hero-note{margin-top:25px;color:#7a8796;font-size:13px}
    .public-section{padding:85px 0;background:var(--bg);border-top:1px solid var(--line)}
    .public-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
    .public-section h2{font-size:38px;letter-spacing:-.03em;margin:8px 0 17px}
    .public-section p{color:var(--muted);line-height:1.8}
    .teacher-card{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);padding:32px;border-radius:var(--radius)}
    .teacher-card h3{font-size:24px;margin:7px 0 10px}
    .simple-footer{background:#fff;border-top:1px solid var(--line);padding:28px 0;color:#788596;font-size:13px}
    .simple-footer .container{display:flex;justify-content:space-between;gap:20px}

    /* Auth: quiet full-page layout with restrained motion */
    .auth-wrap{min-height:calc(100vh - 76px);display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,.82fr);background:#fff;overflow:hidden}
    .auth-intro{display:flex;flex-direction:column;justify-content:center;padding:clamp(32px,7vw,100px);background:#f7f8fa;border-right:1px solid var(--line);animation:authEnter .55s ease both}
    .auth-intro .eyebrow{margin-bottom:16px}.auth-intro h2{font-size:clamp(32px,4vw,54px);line-height:1.08;letter-spacing:-.045em;margin:0 0 18px;max-width:510px}.auth-intro h2 span{color:var(--orange)}
    .auth-intro p{max-width:430px;color:var(--muted);line-height:1.8;margin:0;font-size:15px}
    .auth-main{display:flex;align-items:center;justify-content:center;padding:42px 24px;animation:authEnter .55s .08s ease both}
    .auth-card{width:min(430px,100%);background:transparent;border:0;border-radius:0;padding:0;box-shadow:none}
    .auth-card h1{font-size:32px;letter-spacing:-.035em;margin:7px 0 8px}
    .auth-card .sub{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:25px}
    .auth-progress{display:flex;align-items:center;gap:8px;margin:0 0 25px}.auth-progress span{height:3px;flex:1;border-radius:8px;background:#e7ebf0;transition:background .25s}.auth-progress span.active{background:var(--orange)}
    .auth-step{animation:authStepIn .28s ease both}.auth-step[hidden]{display:none!important}
    .auth-step-title{font-size:18px;font-weight:750;margin:0 0 5px}.auth-step-hint{font-size:13px;color:var(--muted);margin:0 0 20px}
    .auth-back{border:0;background:transparent;color:var(--muted);font-weight:700;padding:10px 0;cursor:pointer}
    @keyframes authEnter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes authStepIn{from{opacity:0;transform:translateX(9px)}to{opacity:1;transform:translateX(0)}}
    .field{margin-bottom:15px}
    .field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
    .field input,.field textarea,.field select{width:100%;border:1px solid #dfe4ea;background:#fff;border-radius:9px;padding:12px 13px;outline:none;color:var(--navy)}
    .field textarea{min-height:120px;resize:vertical}
    .field input:focus,.field textarea:focus{border-color:#f2a166;box-shadow:0 0 0 3px rgba(244,123,32,.10)}
    .form-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
    .auth-links{display:flex;justify-content:space-between;gap:10px;margin-top:16px;font-size:13px}
    .text-btn{border:0;background:transparent;color:var(--orange);font-weight:700;padding:0}
    .text-btn:hover{text-decoration:underline}

    /* Student area */
    .student-main{padding:36px 0 70px}
    .welcome{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:30px}
    .welcome h1{font-size:34px;letter-spacing:-.03em;margin:5px 0 8px}
    .dashboard-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
    .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
    .stat .label{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
    .stat .value{font-size:29px;font-weight:800;margin-top:8px}
    .section-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:30px 0 14px}
    .section-head h2{font-size:21px;margin:0}
    .course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .course-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.18s ease}
    .course-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
    .course-thumb{height:180px;background:#eef1f4;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .course-thumb img{width:100%;height:100%;object-fit:cover}
    .course-body{padding:18px}
    .course-body h3{font-size:18px;margin:0 0 8px}
    .course-body p{color:var(--muted);font-size:13px;line-height:1.6;min-height:42px;margin:0 0 14px}
    .course-meta{display:flex;justify-content:space-between;gap:8px;color:#758296;font-size:12px;margin-bottom:12px}
    .empty{background:#fff;border:1px dashed #dce2e8;border-radius:14px;padding:42px 20px;text-align:center;color:var(--muted)}

    .detail-head{background:#fff;border-bottom:1px solid var(--line);padding:32px 0}
    .detail-layout{display:grid;grid-template-columns:1.4fr .8fr;gap:28px;align-items:start}
    .detail-thumb{height:300px;background:#eef1f4;border-radius:14px;overflow:hidden}
    .detail-thumb img{width:100%;height:100%;object-fit:cover}
    .detail-copy h1{font-size:38px;letter-spacing:-.04em;margin:8px 0 13px}
    .detail-copy p{color:var(--muted);line-height:1.75}
    .lesson-list{display:flex;flex-direction:column;gap:9px}
    .lesson-row{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px}
    .lesson-num{width:34px;height:34px;border-radius:50%;background:#f2f4f6;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
    .lesson-info{min-width:0;flex:1}.lesson-info strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lesson-info small{color:var(--muted)}

    /* Video */
    .lesson-wrap{padding:30px 0 65px}
    .lesson-top{margin-bottom:20px}.lesson-top h1{font-size:32px;margin:5px 0}.lesson-top p{color:var(--muted);line-height:1.7}
    .video-player{position:relative;background:#10151c;border-radius:14px;overflow:hidden;width:100%;aspect-ratio:16/9;box-shadow:0 15px 40px rgba(20,30,45,.14);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
    .video-frame{position:absolute;inset:0}
    .video-frame iframe{width:100%;height:100%;border:0;display:block}
    .video-protect{position:absolute;inset:0;z-index:2;background:transparent;pointer-events:none}
    .custom-video-controls{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:35px 14px 12px;background:linear-gradient(transparent,rgba(8,13,19,.88));-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;transition:opacity .22s ease,transform .22s ease}
    .custom-video-controls button{border:0;background:#1a222c;color:#fff;padding:8px;min-width:38px;border:1px solid #2a3542;border-radius:7px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;transition:background .18s ease,transform .18s ease}
    .custom-video-controls button:hover{background:#25313f}
    .custom-video-controls button:active{transform:scale(.94)}
    .timeline{height:5px;background:#35404c;border-radius:99px;cursor:pointer;margin:0 3px 10px;position:relative;overflow:hidden}
    .timeline span{display:block;height:100%;width:0;background:var(--orange);border-radius:inherit}
    .control-row{display:flex;align-items:center;gap:3px}.control-row .spacer{flex:1}
    .time-label{color:#fff;font-size:12px;min-width:85px;text-align:center}
    .speed-menu{position:relative;flex:none}.speed-pop{display:none;position:absolute;bottom:calc(100% + 9px);right:0;background:#fff;color:#132238;border:1px solid #dfe5ec;border-radius:10px;box-shadow:0 8px 25px rgba(0,0,0,.28);overflow:hidden;min-width:108px;z-index:40;padding:4px}

  function getSavedTheme(){return localStorage.getItem("dopamineTheme")==="dark"?"dark":"light";}
  function applyTheme(theme,rerender=true){
    const next=theme==="dark"?"dark":"light";
    document.documentElement.dataset.theme=next;
    localStorage.setItem("dopamineTheme",next);
    const meta=document.querySelector('meta[name="theme-color"]'); if(meta) meta.content=next==="dark"?"#0d141d":"#ffffff";
    if(rerender && routeFromHash().name==="settings") settingsView();
  }
  function toggleTheme(theme){applyTheme(theme);showToast(nextThemeMessage(theme));}
  function nextThemeMessage(theme){return theme==="dark"?"Dark mode is on.":"Light mode is on.";}
  applyTheme(getSavedTheme(),false);

  function escapeHTML(value){
    return String(value ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  }

  function showToast(message){
    const el = document.getElementById("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(showToast.t);
    showToast.t = setTimeout(() => el.classList.remove("show"), 3200);
  }

  function setView(id, html){
    document.querySelectorAll(".page-view").forEach(v => {
      v.classList.toggle("active", v.id === "view-" + id);
    });
    const el = document.getElementById("view-" + id);
    if(el) el.innerHTML = html;
    window.scrollTo({top:0,behavior:"instant"});
  }

  function routeFromHash(){
    const raw = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
    if(!raw.length) return {name:"home", params:{}};
    if(raw[0] === "course" && raw[1]) return {name:"course-details", params:{courseId:decodeURIComponent(raw[1])}};
    if(raw[0] === "lesson" && raw[1] && raw[2]) return {name:"lesson", params:{courseId:decodeURIComponent(raw[1]),lessonId:decodeURIComponent(raw[2])}};
    return {name:raw[0],params:{}};
  }

  function navigate(name, params = {}, replace = false){
    let path = name;
    if(name === "course-details" && params.courseId) path = "course/" + encodeURIComponent(params.courseId);
    if(name === "lesson" && params.courseId && params.lessonId) path = "lesson/" + encodeURIComponent(params.courseId) + "/" + encodeURIComponent(params.lessonId);
    const url = "#/" + path;
    if(replace) history.replaceState({}, "", url); else history.pushState({}, "", url);
    renderRoute();
  }

  window.navigate = navigate;

                                  </nav>

                            </div>`;

    state.mobileNavOpen = !state.mobileNavOpen;
    const n = document.getElementById("mobile-nav");
    const b = document.querySelector(".mobile-menu");
    if(n) n.classList.toggle("open", state.mobileNavOpen);
    if(b){
      b.classList.toggle("open", state.mobileNavOpen);
      b.setAttribute("aria-label", state.mobileNavOpen ? "Close menu" : "Open menu");
      const icon = b.querySelector(".mi");
      if(icon) icon.textContent = state.mobileNavOpen ? "close" : "menu";
    }
  };
  window.closeMobileNav = () => {
    state.mobileNavOpen = false;
    const n = document.getElementById("mobile-nav");
    const b = document.querySelector(".mobile-menu");
    if(n) n.classList.remove("open");
    if(b){
      b.classList.remove("open");
      b.setAttribute("aria-label", "Open menu");
      const icon = b.querySelector(".mi");
      if(icon) icon.textContent = "menu";
    }
  };

  function homeView(){
    const chemistryMarks = [
      ...Array.from({length: 36}, (_,i) => ({type:"icon", value:["fa-atom","fa-flask","fa-dna","fa-microscope","fa-vial","fa-magnet","fa-circle-nodes","fa-braille"][i%8]})),
      ...["H₂O","NaCl","CO₂","O₂","H₂","CH₄","H₂SO₄","NH₃","Fe","Au","C₆H₁₂O₆","pH","CaCO₃","HCl","e⁻","OH⁻","K","Mg","Zn","Cu","H⁺","NO₃","SO₄","⇌"]
        .map(value=>({type:"formula",value}))
    ];
    const sizes = [24,29,22,26,20,28,23,25,21,27,24,30];
    const cloud = chemistryMarks.map((mark,i)=>{
      const size=sizes[i%sizes.length];
      const tilt=[-8,5,-4,7,0,4,-6][i%7];
      const content=mark.type==="icon" ? `<i class="fa-solid ${mark.value}" aria-hidden="true"></i>` : mark.value;
      return `<span class="chem-mark ${mark.type==='icon'?'chem-icon':'chem-formula'}" style="--s:${size}px;--tilt:${tilt}deg;--idx:${i}">${content}</span>`;
    }).join("");
    return `
      <div class="hero">
        <div class="word-cloud">${cloud}</div>
        <div class="container">
          <div class="hero-layout">
          <div class="hero-copy">
            <div class="eyebrow">DOPAMINE · Chemistry Learning</div>

          </button>
          </div>
        </div>
      </div>

          </div>
          <div class="teacher-card">
            <div class="eyebrow">DOPAMINE Chemistry</div>

  }

  function loginView(message=""){
    return `<div class="auth-wrap">
      <section class="auth-intro"><div class="eyebrow">DOPAMINE · Chemistry</div><h2>Learn chemistry.<br><span>Understand more.</span></h2><p>Your lessons and courses with Mr. Ahmed Dorar, all in one place.</p></section>

          <div class="field"><label for="login-email">Email</label><input id="login-email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
          <div class="field"><label for="login-password">Password</label><input id="login-password" type="password" autocomplete="current-password" placeholder="Enter your password" required></div>

        </form>
        <div class="auth-links"><button class="text-btn" onclick="navigate('register')">Create an account</button><button class="text-btn" onclick="forgotPassword()">Forgot password?</button></div>
      </div></section></div>`;
  }

  function registerView(message=""){
    return `<div class="auth-wrap">
      <section class="auth-intro"><div class="eyebrow">DOPAMINE · Chemistry</div><h2>A better way to<br><span>learn chemistry.</span></h2><p>Create your student account in a few quick steps, then continue to your courses.</p></section>
      <section class="auth-main"><div class="auth-card">
        <div class="eyebrow">Create account · <span id="reg-step-label">Step 1 of 3</span></div><h1>Get started</h1><div class="sub">A few details and you’re ready to learn.</div>
        <div class="auth-progress" aria-label="Registration progress"><span class="active"></span><span></span><span></span></div>
        <div id="register-notice" class="notice ${message?'error':''}">${escapeHTML(message)}</div>

          <section class="auth-step" data-step="0"><h3 class="auth-step-title">What should we call you?</h3><p class="auth-step-hint">Start with your name.</p>

            <div class="form-actions"><button class="btn btn-primary" type="button" onclick="registrationNext(1)">Continue <span class="mi">arrow_forward</span></button><button class="auth-back" type="button" onclick="registrationStep(0)">Back</button></div>
          </section>
          <section class="auth-step" data-step="2" hidden><h3 class="auth-step-title">Secure your account</h3><p class="auth-step-hint">Choose a password and confirm it.</p>

            <div class="field"><label for="reg-confirm">Confirm password</label><input id="reg-confirm" type="password" autocomplete="new-password" minlength="6" placeholder="Enter it again" required></div>
            <div class="form-actions"><button class="btn btn-primary" type="submit">Create account <span class="mi">arrow_forward</span></button><button class="auth-back" type="button" onclick="registrationStep(1)">Back</button></div>
          </section>
        </form>
        <div class="auth-links"><button class="text-btn" onclick="navigate('login')">Already have an account? Log in</button></div>
      </div></section></div>`;

  window.registrationStep=function(step){
    document.querySelectorAll('#register-form .auth-step').forEach(el=>{el.hidden=Number(el.dataset.step)!==step});
    document.querySelectorAll('.auth-progress span').forEach((el,i)=>el.classList.toggle('active',i<=step));
    const label=document.getElementById('reg-step-label');if(label)label.textContent=`Step ${step+1} of 3`;
    const notice=document.getElementById('register-notice');if(notice){notice.textContent='';notice.className='notice'}
    const current=document.querySelector(`#register-form .auth-step[data-step="${step}"] input`);current?.focus({preventScroll:true});
  };
  window.registrationNext=function(step){
    const section=document.querySelector(`#register-form .auth-step[data-step="${step}"]`);if(!section)return;
    const inputs=[...section.querySelectorAll('input')];for(const input of inputs){if(!input.reportValidity())return}
    if(step===1){const email=document.getElementById('reg-email');if(email.value.trim()!==email.value.trim().toLowerCase())email.value=email.value.trim().toLowerCase()}
    registrationStep(step+1);
  };

            </div>
          </div>
        </div>
      </div>

  async function contactView(){
    setView("contact", `<div class="contact-page"><div class="container"><div class="contact-content"><h1 class="contact-heading">Contact Us</h1><p class="contact-subheading">Get in touch with DOPAMINE.</p><div class="contact-methods"><div class="loading"><div class="spinner"></div>Loading...</div></div></div></div></div>`);
    try{
      const snap = await getDoc(doc(db,"settings","contact"));
      const box = document.querySelector("#view-contact .contact-methods");
      if(!box) return;
      if(!snap.exists()){
        box.innerHTML=`<div class="contact-unavailable">Contact details are not available right now.</div>`;
        return;
      }
      const d=snap.data();
      const phone=String(d.phone||"").trim();
      const whatsapp=String(d.whatsapp||"").trim();
      const email=String(d.email||"").trim();
      const address=String(d.address||"").trim();
      const digits=value=>value.replace(/[^0-9]/g,"");
      const rows=[];
      if(phone) rows.push(`<article class="contact-method"><span class="contact-method-icon"><span class="mi">call</span></span><div class="contact-method-info"><h3>Phone</h3><p class="contact-value">${escapeHTML(phone)}</p></div><a class="contact-action" href="tel:${escapeHTML(phone.replace(/[^+0-9]/g,""))}">Call</a></article>`);

  async function hashPassword(password){
    const data = new TextEncoder().encode(password);
    const hash = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }

  function generateUserId(){
    if(crypto.randomUUID) return crypto.randomUUID().replace(/-/g,"");
    return "u_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,12);
  }

  async function verifyPassword(password, expectedHash){
    return (await hashPassword(password)) === expectedHash;
  }

  function imageFromBase64(base64){
    if(!base64) return "";
    return base64.startsWith("data:")?base64:"data:image/jpeg;base64,"+base64;
  }

  async function compressImage(file,maxBytes=850*1024,maxDimension=1400){
    if(!file || !file.type.startsWith("image/")) throw new Error("image");
    const img=await new Promise((resolve,reject)=>{
      const url=URL.createObjectURL(file);const i=new Image();
      i.onload=()=>{URL.revokeObjectURL(url);resolve(i)};i.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("image"))};i.src=url;
    });
    let scale=Math.min(1,maxDimension/Math.max(img.width,img.height));
    let quality=.84;
    let blob=null;
    for(let attempt=0;attempt<9;attempt++){
      const canvas=document.createElement("canvas");
      canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
      const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,canvas.width,canvas.height);
      blob=await new Promise(r=>canvas.toBlob(r,"image/jpeg",quality));
      if(blob && blob.size<=maxBytes) break;
      quality=Math.max(.45,quality-.07);
      if(attempt===3 || attempt===6) scale*=.82;
    }
    if(!blob || blob.size>maxBytes) throw new Error("large");
    return await new Promise((resolve,reject)=>{
      const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob);
    });
  }
  function imageToBase64(dataUrl){return String(dataUrl).split(",")[1]||""}
  function validateBase64Size(base64,maxBytes=1024*1024){return Math.ceil(base64.length*3/4)<=maxBytes}
  async function processImageForFirestore(file){
    const dataUrl=await compressImage(file,700*1024,1200);
    const base64=imageToBase64(dataUrl);
    if(!validateBase64Size(base64)) throw new Error("large");
    return dataUrl;
  }

  function youtubeId(value){
    if(!value)return "";
    const s=String(value).trim();
    if(/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
    try{
      const u=new URL(s);
      if(u.hostname.includes("youtu.be")) return u.pathname.slice(1).split("/")[0];
      if(u.hostname.includes("youtube.com")){
        if(u.pathname==="/watch") return u.searchParams.get("v")||"";
        if(u.pathname.startsWith("/embed/")) return u.pathname.split("/")[2]||"";
        if(u.pathname.startsWith("/shorts/")) return u.pathname.split("/")[2]||"";
      }
    }catch(e){}
    return "";
  }

function renderLessonResources(lesson){
  const resources=Array.isArray(lesson?.resources)?lesson.resources:[];
  if(!resources.length)return `<div class="content-card lesson-resources-card"><div class="lesson-resources-head"><div class="lesson-resources-title"><div class="lesson-resources-icon"><span class="mi">folder_open</span></div><div><h3>Resources</h3><p class="lesson-resources-sub">Files for this lesson</p></div></div></div><div class="lesson-resources-empty"><span class="mi">folder_off</span>No resources have been added to this lesson yet.</div></div>`;
  return `<div class="content-card lesson-resources-card"><div class="lesson-resources-head"><div class="lesson-resources-title"><div class="lesson-resources-icon"><span class="mi">folder_open</span></div><div><h3>Resources</h3><p class="lesson-resources-sub">${resources.length} ${resources.length===1?'resource':'resources'} available for this lesson</p></div></div></div><div class="lesson-resource-grid">${resources.map(r=>{
    const name=String(r.name||r.originalName||'Resource');
    const rawUrl=String(r.url||'');
    const viewUrl=resourceViewUrl(rawUrl);
    const downloadUrl=resourceDownloadUrl(rawUrl);
    const type=String(r.type||'File').split('/').pop();
    return `<div class="lesson-resource-card"><div class="lesson-resource-left"><div class="lesson-resource-file-icon"><span class="mi">${resourceIcon(r.type,name)}</span></div><div class="lesson-resource-info"><div class="lesson-resource-name">${escapeHTML(name)}</div><div class="lesson-resource-meta">${escapeHTML(type)}</div></div></div><div class="lesson-resource-actions"><a class="lesson-resource-btn" href="${escapeHTML(viewUrl)}" target="_blank" rel="noopener noreferrer"><span class="mi">visibility</span><span>View</span></a><a class="lesson-resource-btn primary" href="${escapeHTML(downloadUrl)}" target="_blank" rel="noopener noreferrer" download="${escapeHTML(name)}"><span class="mi">download</span><span>Download</span></a></div></div>`;
  }).join('')}</div></div>`;
}

    setView("lesson",`<div class="lesson-wrap"><div class="container"><div class="lesson-layout"><main>

      ${videoId?`<div id="video-player" class="video-player" oncontextmenu="return false">
        <div class="video-frame"><div id="youtube-frame"></div></div>
        <div class="video-protect" oncontextmenu="return false" ondragstart="return false"></div>
        <div id="center-play-circle" class="center-play-circle"><span class="mi">play_arrow</span></div>
        <div class="custom-video-controls">
          <div id="timeline" class="timeline"><span id="timeline-fill"></span></div>
          <div class="control-row">
            <button onclick="seekVideo(-10)" id="back10-btn" aria-label="Back 10 seconds"><span class="mi">replay_10</span></button>
            <button onclick="videoPlayPause()" id="play-btn" aria-label="Play"><span class="mi">play_arrow</span></button>

            <div class="speed-menu" id="speed-menu"><button onclick="toggleSpeedMenu()" aria-label="Playback speed"><span class="mi">speed</span> 1×</button><div class="speed-pop">${[.75,1,1.25,1.5,1.75,2].map(s=>`<button onclick="setSpeed(${s})">${s}x</button>`).join("")}</div></div>
            <button onclick="togglePlayerSettings()" id="settings-btn" aria-label="Settings"><span class="mi">settings</span></button>

  function setPlayButtonIcon(playing){
    const btn=document.getElementById("play-btn");
    if(btn) btn.innerHTML=`<span class="mi">${playing?"pause":"play_arrow"}</span>`;
  }
  function syncCenterPlayIcon(stateValue){
    const circle=document.getElementById("center-play-circle");
    if(!circle || !state.currentPlayer) return;
    let stateNow=stateValue;
    try{ if(typeof stateNow!=="number") stateNow=state.currentPlayer.getPlayerState(); }catch(e){}
    const playing=window.YT && stateNow===YT.PlayerState.PLAYING;
    const icon=circle.querySelector(".mi");
    if(icon) icon.textContent=playing?"pause":"play_arrow";
    setPlayButtonIcon(playing);
    if(playing){
      circle.classList.add("show");
      clearTimeout(window.__centerPlayTimer);
      window.__centerPlayTimer=setTimeout(()=>circle.classList.remove("show"),900);
    }else{
      circle.classList.add("show");
    }
  }

  function playerIsPlaying(){
    try{return !!state.currentPlayer && state.currentPlayer.getPlayerState()===YT.PlayerState.PLAYING}catch(e){return false}
  }
  function playerCurrentTime(){
    try{return Number(state.currentPlayer?.getCurrentTime?.()||0)}catch(e){return 0}
  }
  function playerDuration(){
    try{return Number(state.currentPlayer?.getDuration?.()||0)}catch(e){return 0}
  }
  function formatPlayerTime(t){
    t=Math.max(0,Math.floor(Number(t)||0));
    return Math.floor(t/60)+":"+String(t%60).padStart(2,"0");
  }

  function showPlayerControls(forceVisible=false){
    const wrap=document.getElementById("video-player");
    if(!wrap)return;
    wrap.classList.remove("controls-hidden");
    clearTimeout(window.__playerHideTimer);
    if(forceVisible || !playerIsPlaying()) return;
    window.__playerHideTimer=setTimeout(()=>{
      const speed=document.getElementById("speed-menu"),settings=document.getElementById("settings-panel");
      if(speed) speed.classList.remove("open");
      if(settings) settings.classList.remove("open");
      wrap.classList.add("controls-hidden");
    },4000);
  }
  function setupPlayerAutoHide(){
    const wrap=document.getElementById("video-player");
    if(!wrap || wrap.__autoHideBound)return;
    wrap.__autoHideBound=true;
    ["mousemove","mousedown","touchstart","touchmove","pointerdown","pointermove","keydown"].forEach(ev=>wrap.addEventListener(ev,()=>showPlayerControls(),{passive:true}));
    showPlayerControls();
  }

  function syncVideoProgress(){
    const fill=document.getElementById("timeline-fill"),label=document.getElementById("time-label");
    if(!fill||!label||!state.currentPlayer)return;
    const current=playerCurrentTime(),duration=playerDuration();
    const pct=duration>0?Math.min(100,Math.max(0,current/duration*100)):0;
    fill.style.width=pct+"%";
    label.textContent=`${formatPlayerTime(current)} / ${formatPlayerTime(duration)}`;
  }

  function seekVideo(sec){
    showPlayerControls();
    if(!state.currentPlayer)return;
    const duration=playerDuration(),target=Math.min(Math.max(0,playerCurrentTime()+Number(sec)),duration||playerCurrentTime()+Number(sec));
    try{state.currentPlayer.seekTo(target,true)}catch(e){}
  }

  window.videoPlayPause=()=>{
    showPlayerControls();
    if(!state.currentPlayer || !state.playerReady)return;
    try{playerIsPlaying()?state.currentPlayer.pauseVideo():state.currentPlayer.playVideo()}catch(e){}
  };
  window.videoMute=()=>{
    showPlayerControls();
    if(!state.currentPlayer)return;
    try{
      const btn=document.getElementById("mute-btn");
      if(state.currentPlayer.isMuted()){state.currentPlayer.unMute();if(btn)btn.innerHTML='<span class="mi">volume_up</span>'}
      else{state.currentPlayer.mute();if(btn)btn.innerHTML='<span class="mi">volume_off</span>'}
    }catch(e){}
  };
  window.toggleSpeedMenu=()=>{
    showPlayerControls();
    document.getElementById("settings-panel")?.classList.remove("open");
    document.getElementById("speed-menu")?.classList.toggle("open");
  };
  window.setSpeed=(speed)=>{
    showPlayerControls();
    try{state.currentPlayer?.setPlaybackRate?.(Number(speed))}catch(e){}
    const menu=document.getElementById("speed-menu"),btn=menu?.querySelector(":scope > button");
    if(btn)btn.innerHTML=`<span class="mi">speed</span> ${Number(speed)}×`;
    menu?.classList.remove("open");
    document.querySelectorAll(".settings-speed-options .quality-btn").forEach(b=>b.classList.toggle("active",Number(b.textContent.replace("×",""))===Number(speed)));
  };
  window.togglePlayerSettings=()=>{
    showPlayerControls();
    document.getElementById("speed-menu")?.classList.remove("open");
    document.getElementById("settings-panel")?.classList.toggle("open");
  };
  window.setVideoQuality=(quality)=>{
    showPlayerControls();
    try{state.currentPlayer?.setPlaybackQuality?.(quality)}catch(e){}
    document.querySelectorAll(".quality-btn").forEach(b=>b.classList.toggle("active",b.dataset.quality===quality));
  };
  window.setCaptions=(enabled)=>{
    showPlayerControls();
    try{
      if(enabled){
        state.currentPlayer?.loadModule?.("captions");
        state.currentPlayer?.setOption?.("captions","track",{languageCode:"en"});
      }else{
        state.currentPlayer?.setOption?.("captions","track",{});
        state.currentPlayer?.unloadModule?.("captions");
      }
    }catch(e){}
    document.getElementById("captions-on-btn")?.classList.toggle("active",enabled);
    document.getElementById("captions-off-btn")?.classList.toggle("active",!enabled);
  };
  window.toggleCaptions=()=>setCaptions(!(document.getElementById("captions-on-btn")?.classList.contains("active")));

  window.toggleFullscreen=()=>{
    showPlayerControls(true);
    const player=document.getElementById("video-player");
    if(!player)return;
    try{
      if(!document.fullscreenElement) player.requestFullscreen?.();
      else document.exitFullscreen?.();
    }catch(e){}
  };

  function bindTimeline(){
    const timeline=document.getElementById("timeline");
    if(!timeline || timeline.__bound)return;
    timeline.__bound=true;
    timeline.addEventListener("click",e=>{
      showPlayerControls();
      if(!state.currentPlayer)return;
      const r=timeline.getBoundingClientRect(),pct=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
      try{state.currentPlayer.seekTo(pct*playerDuration(),true)}catch(err){}
    });
    if(!window.__videoProgressTimer) window.__videoProgressTimer=setInterval(syncVideoProgress,500);
  }

  function initPlayerInteractions(){
    const wrap=document.getElementById("video-player"),protect=document.querySelector(".video-protect"),center=document.getElementById("center-play-circle");
    if(!wrap || wrap.__playerInteractionsBound)return;
    wrap.__playerInteractionsBound=true;
    setupPlayerAutoHide();
    bindTimeline();

    let clickTimer=null;
    const clickTarget=protect||wrap;
    clickTarget.style.pointerEvents="auto";
    clickTarget.style.cursor="pointer";
    clickTarget.onclick=e=>{
      if(e.target.closest(".custom-video-controls"))return;
      showPlayerControls();
      if(clickTimer){clearTimeout(clickTimer);clickTimer=null;seekVideo(e.clientX < wrap.getBoundingClientRect().left+wrap.getBoundingClientRect().width/2 ? -10 : 10);return}
      clickTimer=setTimeout(()=>{clickTimer=null;videoPlayPause()},260);
    };
    center?.addEventListener("click",videoPlayPause);
    document.addEventListener("fullscreenchange",()=>showPlayerControls(true));
  }

  function initPlayer(videoId){
    return loadYouTubeAPI().then(()=>{
      state.playerReady=false;
      state.currentPlayer=new YT.Player("youtube-frame",{
        videoId,
        playerVars:{autoplay:1,rel:0,modestbranding:1,controls:0,fs:0,playsinline:1,enablejsapi:1,disablekb:1,cc_load_policy:0,iv_load_policy:3},
        events:{
          onReady:(e)=>{
            state.playerReady=true;
            try{e.target.playVideo()}catch(err){}
            updateVideoUI();
            initPlayerInteractions();
            syncVideoProgress();
            showPlayerControls();
          },
          onStateChange:(e)=>{
            syncCenterPlayIcon(e.data);
            showPlayerControls();
          },
          onError:()=>showToast("Unable to load this lesson.")
        }
      });
    }).catch(error=>{console.error(error);showToast("Unable to load this lesson.")});
  }

  function updateVideoUI(){
    const playing=playerIsPlaying();
    setPlayButtonIcon(playing);
    syncCenterPlayIcon();
  }
  async function notificationsView(){
  setView("notifications",`<div class="student-main"><div class="container"><div class="loading"><div class="spinner"></div>Loading notifications...</div></div></div>`);
  try{
    const snap=await getDocs(query(collection(db,"paymentRequests"),where("studentId","==",state.user.id)));
    const items=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{
      const ta=a.createdAt?.seconds?Number(a.createdAt.seconds):0;
      const tb=b.createdAt?.seconds?Number(b.createdAt.seconds):0;
      return tb-ta;
    });
    const relevant=items.filter(x=>["pending","rejected","approved"].includes(x.status));
    const rows=relevant.length?relevant.map(x=>{
      const titles=escapeHTML((x.courseTitles||[]).join(", ")||"your course");
      const status=x.status;
      const isPending=status==="pending", isRejected=status==="rejected";
      const icon=isPending?"hourglass_top":isRejected?"error":"check_circle";
      const title=isPending?"Payment under review":isRejected?"Payment needs attention":"Payment approved";
      const text=isPending?`Your payment for ${titles} is being reviewed.`:isRejected?`Your payment for ${titles} was rejected. ${escapeHTML(x.rejectionReason||"Please check your payment details.")}`:`Your payment for ${titles} has been approved. You can access the course now.`;
      return `<div class="notification-item"><div class="notification-icon ${isRejected?'is-error':status==='approved'?'is-success':''}"><span class="mi">${icon}</span></div><div class="notification-copy"><strong>${title}</strong><p>${text}</p><small>${escapeHTML(formatNotificationDate(x.createdAt))}</small></div></div>`;
    }).join(""):`<div class="empty"><span class="mi" style="font-size:34px">notifications_none</span><h2>No notifications yet</h2><p>Payment updates and important account messages will appear here.</p></div>`;
    setView("notifications",`<div class="student-main"><div class="container"><div class="section-head" style="margin-top:0"><div><div class="eyebrow">Student Area</div><h1 style="font-size:32px;margin:5px 0">Notifications</h1><div class="muted">Payment updates and important account messages.</div></div></div><div class="notifications-list">${rows}</div></div></div>`);
  }catch(error){
    console.error("[DOPAMINE] Notifications/Firestore error:",error);
    setView("notifications",`<div class="student-main"><div class="container"><div class="empty"><span class="mi" style="font-size:34px">cloud_off</span><h2>Notifications are unavailable</h2><p>We could not reach the database right now. Please try again.</p><button class="btn btn-primary" onclick="navigate('notifications')">Try again</button></div></div></div>`);
  }
}
function formatNotificationDate(value){
  try{
    if(value?.toDate) return value.toDate().toLocaleString([], {dateStyle:"medium",timeStyle:"short"});
    if(value?.seconds) return new Date(Number(value.seconds)*1000).toLocaleString([], {dateStyle:"medium",timeStyle:"short"});
  }catch(e){}
  return "Recent";
}

      const [coursesSnap,usersSnap]=await Promise.all([getDocs(collection(db,"courses")),getDocs(query(collection(db,"users"),where("role","==","student")))]);
      document.getElementById("admin-course-count").textContent=coursesSnap.size; document.getElementById("admin-student-count").textContent=usersSnap.size;
      document.getElementById("admin-students").innerHTML=usersSnap.empty?`<div class="empty"><span class="mi">group_off</span><br>No students yet.</div>`:usersSnap.docs.map(d=>{const x=d.data();return `<div class="info-row"><span><strong>${escapeHTML(x.fullName||"Student")}</strong><br><small>${escapeHTML(x.email||"")}</small></span><strong><span class="mi">lock</span> Password protected</strong></div>`}).join("");
      document.getElementById("admin-course-form")?.addEventListener("submit",adminCreateCourse);
      document.getElementById("admin-course-access")?.addEventListener("change",e=>document.getElementById("admin-price-field").style.display=e.target.value==="paid"?"block":"none");
    }catch(e){console.error(e);showToast("Unable to load admin data.");}
  }

  async function adminCreateCourse(e){
    e.preventDefault(); const btn=e.currentTarget.querySelector("button[type=submit]"), file=document.getElementById("admin-course-image").files?.[0]; if(!file)return; btn.disabled=true; btn.innerHTML='<span class="mi">progress_activity</span> Uploading...';
    try{const paid=document.getElementById("admin-course-access").value==="paid",price=Number(document.getElementById("admin-course-price").value)||0;if(paid&&price<=0)throw new Error("price");const dataUrl=await processImageForFirestore(file); const base64=imageToBase64(dataUrl); await addDoc(collection(db,"courses"),{title:document.getElementById("admin-course-title").value.trim(),description:document.getElementById("admin-course-description").value.trim(),thumbnailBase64:base64,teacher:"Mr. Ahmed Dorar",isPaid:paid,price:paid?price:0,createdAt:serverTimestamp(),updatedAt:serverTimestamp()}); showToast("Course added."); adminView();}catch(err){console.error(err);showToast(err.message==="large"?"The image could not be compressed below 1 MB.":err.message==="price"?"Enter a valid course amount.":"Could not add the course.");}finally{btn.disabled=false;}
  }
  window.adminCreateCourse=adminCreateCourse;

  window.openTeacherAbout = function(){
    navigate("about");
  };

  async function renderRoute(){
    renderHeader();
    const route=routeFromHash();
    let name=route.name,params=route.params;
    if(!publicRoutes.has(name)&&!protectedRoutes.has(name)) {navigate("home",{},true);return}
    if(protectedRoutes.has(name)&&!state.session){
      state.pendingRoute={name,params};
      navigate("login",{},true);return;
    }
    if(publicRoutes.has(name)&&state.session&&(name==="login"||name==="register")){
      navigate("dashboard",{},true);return;
    }
    if(name==="home"){setView("home",homeView());return}
    if(name==="login"){
      setView("login",loginView());
      document.getElementById("login-form")?.addEventListener("submit",handleLogin);return;
    }
    if(name==="register"){
      setView("register",registerView());
      document.getElementById("register-form")?.addEventListener("submit",handleRegister);return;
    }
    if(name==="about"){setView("about",aboutView());return}
    if(name==="contact"){await contactView();return}
    if(name==="dashboard"){await dashboardView();return}
    if(name==="courses"){await coursesView();return}
    if(name==="course-details"){await courseDetailsView(params.courseId);return}
    if(name==="cart"){await cartView();return}
    if(name==="checkout"){await checkoutView();return}
    if(name==="payment"){navigate("cart",{},true);return}
    if(name==="lesson"){await lessonView(params.courseId,params.lessonId);return}
    if(name==="profile"){await profileView();return}
    if(name==="settings"){settingsView();return}
    if(name==="notifications"){await notificationsView();return}
    if(name==="admin"){await adminView();return}
  }

  window.addEventListener("popstate",renderRoute);
  window.addEventListener("hashchange",renderRoute);

  (async function boot(){
    try{
      const restored=await restoreSession();
      if(restored) navigate("dashboard",{},true);
      else navigate("home",{},true);
    }catch(error){
      console.error(error);navigate("home",{},true);
    }
  })();
</script>
</body>
</html>
