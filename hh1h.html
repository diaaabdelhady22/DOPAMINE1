<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE UCP - 4-FSK Protocol</title>
    <style>
        :root {
            --bg: #edf2f7;
            --panel: #f8fafc;
            --text: #14213d;
            --muted: #5b6b7f;
            --accent: #2f5f8c;
            --accent-2: #4d7aa7;
            --border: rgba(20, 33, 61, 0.16);
            --shadow: 0 16px 40px rgba(15, 23, 34, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f7f9fc 0%, #e9eef4 100%);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .app-shell {
            width: min(100%, 760px);
            position: relative;
        }

        .container {
            position: relative;
            overflow: hidden;
            background: var(--panel);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 18px;
        }

        .brand-badge {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: #ffffff;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 8px 18px rgba(47, 95, 140, 0.18);
        }

        .brand h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #14213d;
        }

        .brand p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 0.85rem;
            text-align: center;
        }

        .mode-switch {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 18px 0 16px;
        }

        .mode-btn {
            flex: 1;
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: var(--text);
            background: #eef3f8;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 10px 20px rgba(47, 95, 140, 0.16);
        }

        .panel {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .panel.active { display: block; }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-weight: 700;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: #ffffff;
            color: var(--text);
            font-size: 1rem;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(47, 95, 140, 0.12);
        }

        .action-btn {
            margin-top: 14px;
            width: 100%;
            border: none;
            padding: 13px 16px;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: #ffffff;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 10px 20px rgba(47, 95, 140, 0.16);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .status { color: #325d85; font-weight: 700; }

        .result-box {
            margin-top: 14px;
            min-height: 92px;
            padding: 14px;
            border-radius: 14px;
            background: #f3f6fa;
            border: 1px solid var(--border);
            color: #23415f;
            font-size: 1.05rem;
            font-weight: 700;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="app-shell">
    <div class="container">
        <div class="brand">
            <div class="brand-badge">UCP</div>
            <div>
                <h1>THE UCP</h1>
                <p>ULTRASONIC COMMUNICATION PROTOCOL (4-FSK DIBIT)</p>
            </div>
        </div>

        <div class="mode-switch">
            <button class="mode-btn active" id="sendModeBtn" onclick="showPanel('send')">Send Message</button>
            <button class="mode-btn" id="receiveModeBtn" onclick="showPanel('receive')">Receive Message</button>
        </div>

        <div class="panel active" id="sendPanel">
            <label for="textInput">Type your message</label>
            <textarea id="textInput" placeholder="Enter text to transmit..."></textarea>
            <button class="action-btn" id="sendBtn" onclick="transmitText()">Send</button>
        </div>

        <div class="panel" id="receivePanel">
            <div class="status-row">
                <span>Listening mode</span>
                <span class="status" id="statusText">Microphone is off</span>
            </div>
            <button class="action-btn" id="listenBtn" onclick="startListening()">Start Listening</button>
            <div class="result-box" id="receivedText"></div>
        </div>
    </div>
</div>

<script>
    // خريطة الترددات لنظام 4-FSK مع مسافة واسعة جداً لمنع أي تداخل
    const FREQS = {
        START: 17500, // نغمة بداية الحزمة (HEADER)
        '00':  18500,
        '01':  19000,
        '10':  19500,
        '11':  20000
    };

    const TONE_DURATION = 0.08; // 80ms لكل نغمة
    const PAUSE_DURATION = 0.02; // 20ms فاصل

    function showPanel(mode) {
        document.getElementById('sendPanel').classList.toggle('active', mode === 'send');
        document.getElementById('receivePanel').classList.toggle('active', mode === 'receive');
        document.getElementById('sendModeBtn').classList.toggle('active', mode === 'send');
        document.getElementById('receiveModeBtn').classList.toggle('active', mode === 'receive');
    }

    // إرسال نغمة جيبية منفردة
    function playTone(audioCtx, freq, duration) {
        return new Promise(resolve => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            // Smooth Envelope لمحو صوت الضغط "Clicks"
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.01);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime + duration - 0.01);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);

            setTimeout(resolve, (duration + PAUSE_DURATION) * 1000);
        });
    }

    // تحويل النص إلى سلسلة بتات وإرسالها
    async function transmitText() {
        const text = document.getElementById('textInput').value;
        if (!text) return;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        document.getElementById('sendBtn').disabled = true;

        // إرسال نغمة البداية للتنبيه
        await playTone(audioCtx, FREQS.START, 0.15);

        for (let char of text) {
            let code = char.charCodeAt(0);
            let bin = code.toString(2).padStart(8, '0'); // تحويل إلى 8 بت

            // تقسيم البتات الثمانية إلى 4 أجزاء ثنائية (Dibits)
            let dibits = [
                bin.substring(0, 2),
                bin.substring(2, 4),
                bin.substring(4, 6),
                bin.substring(6, 8)
            ];

            for (let dibit of dibits) {
                let freq = FREQS[dibit];
                await playTone(audioCtx, freq, TONE_DURATION);
            }
        }

        document.getElementById('sendBtn').disabled = false;
    }

    // --- قسم الاستقبال (Decoder) ---
    let isListening = false;
    let audioContext, analyser, stream;
    let receivedBits = [];
    let isReceivingFrame = false;

    async function startListening() {
        if (isListening) return;

        try {
            stream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: false,
                    noiseSuppression: false,
                    autoGainControl: false
                },
                video: false
            });

            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048; // كافي جداً لأن الفارق بين الترددات كبير (500Hz)

            let source = audioContext.createMediaStreamSource(stream);
            source.connect(analyser);

            isListening = true;
            document.getElementById('statusText').innerText = "Listening now...";
            document.getElementById('receivedText').innerText = "";
            document.getElementById('listenBtn').disabled = true;

            processAudio();
        } catch (err) {
            alert("Please allow microphone access.");
            console.error(err);
        }
    }

    function processAudio() {
        if (!isListening) return;

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(dataArray);

        // البحث عن أعلى تردد مستقبَل
        let maxVal = 0;
        let maxFreq = 0;

        for (let i = 0; i < bufferLength; i++) {
            let freq = i * (audioContext.sampleRate / 2) / bufferLength;
            if (freq >= 17000 && freq <= 20500) {
                if (dataArray[i] > maxVal) {
                    maxVal = dataArray[i];
                    maxFreq = freq;
                }
            }
        }

        // فحص ما إذا كانت هناك إشارة قوية
        if (maxVal > 50) {
            let detectedDibit = matchFrequency(maxFreq);

            if (detectedDibit === 'START') {
                isReceivingFrame = true;
                receivedBits = [];
            } else if (isReceivingFrame && detectedDibit) {
                // إدخال الـ Dibit إذا كان يختلف عن السابق لتجنب تكرار الإطار الواحدة
                if (receivedBits.length === 0 || receivedBits[receivedBits.length - 1] !== detectedDibit) {
                    receivedBits.push(detectedDibit);

                    // كل 4 Dibits تشكل حرفاً كاملاً (8 bits)
                    if (receivedBits.length % 4 === 0) {
                        let fullBin = receivedBits.slice(-4).join('');
                        let charCode = parseInt(fullBin, 2);
                        let char = String.fromCharCode(charCode);
                        
                        document.getElementById('receivedText').innerText += char;
                    }
                }
            }
        }

        requestAnimationFrame(processAudio);
    }

    // مطابقة التردد المستقبَل مع أقرب Dibit
    function matchFrequency(freq) {
        let tolerance = 150; // هامش خطأ للتردد

        if (Math.abs(freq - FREQS.START) < tolerance) return 'START';
        if (Math.abs(freq - FREQS['00']) < tolerance) return '00';
        if (Math.abs(freq - FREQS['01']) < tolerance) return '01';
        if (Math.abs(freq - FREQS['10']) < tolerance) return '10';
        if (Math.abs(freq - FREQS['11']) < tolerance) return '11';

        return null;
    }
</script>

</body>
</html>
