<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>UCP - Pulse Width Test</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
    padding:25px;
}

h1{
    margin-bottom:5px;
}

.subtitle{
    color:#aaa;
    margin-bottom:25px;
}

.card{
    background:#1b1b1b;
    border:1px solid #333;
    padding:20px;
    margin-bottom:18px;
    border-radius:12px;
}

h2{
    margin-top:0;
}

input{
    width:100%;
    padding:14px;
    font-size:17px;
    background:#0d0d0d;
    color:white;
    border:1px solid #444;
    border-radius:8px;
    outline:none;
}

button{
    padding:13px 18px;
    margin:7px 5px 0 0;
    border:0;
    border-radius:8px;
    background:#fff;
    color:#111;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.85;
}

button.stop{
    background:#b22;
    color:#fff;
}

.status{
    margin-top:15px;
    padding:15px;
    background:#080808;
    border-radius:8px;
    min-height:50px;
    white-space:pre-wrap;
    font-family:monospace;
}

.meter{
    height:20px;
    background:#080808;
    border-radius:10px;
    overflow:hidden;
    margin-top:10px;
}

.meterFill{
    height:100%;
    width:0%;
    background:#fff;
    transition:width .05s linear;
}

.result{
    font-size:25px;
    padding:20px;
    background:#080808;
    border-radius:8px;
    min-height:70px;
    word-break:break-word;
}

.bitbox{
    font-family:monospace;
    font-size:18px;
    line-height:1.6;
    word-break:break-all;
    color:#ddd;
}
</style>
</head>

<body>

<div class="container">

<h1>UCP — Pulse Width Test</h1>
<div class="subtitle">
Single ultrasonic carrier + pulse-width data encoding
</div>

<!-- TRANSMITTER -->

<div class="card">

<h2>1. Transmitter</h2>

<input
    id="message"
    value="HELLO UCP"
    placeholder="Type message..."
>

<br>

<button onclick="startAudio()">
START AUDIO
</button>

<button onclick="sendMessage()">
SEND ULTRASONIC
</button>

<button class="stop" onclick="stopTransmit()">
STOP
</button>

<div class="status" id="txStatus">
Transmitter idle.
</div>

<div class="bitbox" id="txBits">
Bits: -
</div>

</div>


<!-- RECEIVER -->

<div class="card">

<h2>2. Receiver</h2>

<button onclick="startReceiver()">
START MICROPHONE
</button>

<button onclick="calibrate()">
CALIBRATE SILENCE
</button>

<button class="stop" onclick="stopReceiver()">
STOP MICROPHONE
</button>

<div class="status" id="rxStatus">
Receiver idle.
</div>

<div class="meter">
<div class="meterFill" id="meter"></div>
</div>

<br>

<div class="status">
Detected pulses:
<span id="pulseInfo">0</span>
</div>

</div>


<!-- RESULT -->

<div class="card">

<h2>3. Decoded message</h2>

<div class="result" id="result">
Waiting...
</div>

</div>


<!-- DEBUG -->

<div class="card">

<h2>Debug</h2>

<div class="status" id="debug">
No data.
</div>

</div>

</div>


<script>

/*
========================================================
UCP PULSE WIDTH PROTOCOL
========================================================

Carrier:
    20.5 kHz

Pulse encoding:

    0 = 45 ms carrier
    1 = 90 ms carrier

Gap:
    55 ms

Sync:
    8 pulses

    short
    long
    short
    long
    short
    long
    short
    long

Packet:

    SYNC
    0xAA
    LENGTH
    DATA
    CHECKSUM
    0x55

========================================================
*/


/* ================================
   CONFIG
================================ */

const CARRIER = 20500;

// Pulse lengths
const SHORT_PULSE = 45;
const LONG_PULSE  = 90;

// Gap between pulses
const GAP = 55;

// Tolerance when measuring pulse width
const WIDTH_TOLERANCE = 22;

// Receiver threshold multiplier
const THRESHOLD_MULTIPLIER = 2.5;


/* ================================
   GLOBALS
================================ */

let audioContext = null;

let txOscillator = null;
let txGain = null;

let receiverStream = null;
let receiverSource = null;
let analyser = null;
let receiverRunning = false;

let receiverLoop = null;

let noiseLevel = 0.0001;

let pulseActive = false;
let pulseStart = 0;

let detectedPulses = [];

let syncBuffer = [];

let currentBits = [];

let receivingPacket = false;

let lastPulseTime = 0;


/* ================================
   UI
================================ */

const txStatus = document.getElementById("txStatus");
const rxStatus = document.getElementById("rxStatus");
const result = document.getElementById("result");
const debug = document.getElementById("debug");
const meter = document.getElementById("meter");
const pulseInfo = document.getElementById("pulseInfo");
const txBits = document.getElementById("txBits");


function setTX(text){
    txStatus.textContent = text;
}

function setRX(text){
    rxStatus.textContent = text;
}

function setDebug(text){
    debug.textContent = text;
}


/* ================================
   AUDIO
================================ */

async function startAudio(){

    try{

        if(!audioContext){

            audioContext =
                new (window.AudioContext ||
                window.webkitAudioContext)();

        }

        if(audioContext.state === "suspended"){
            await audioContext.resume();
        }

        setTX(
            "Audio ready.\n" +
            "Carrier = " + CARRIER + " Hz\n" +
            "Sample rate = " + audioContext.sampleRate
        );

    }catch(err){

        setTX("Audio error: " + err.message);

    }

}


/* ================================
   TEXT -> BYTES
================================ */

function textToBytes(text){

    return new TextEncoder().encode(text);

}


/* ================================
   CHECKSUM
================================ */

function checksum(bytes){

    let x = 0;

    for(let i=0;i<bytes.length;i++){

        x ^= bytes[i];

    }

    return x;

}


/* ================================
   BYTES -> BITS
================================ */

function bytesToBits(bytes){

    let bits = [];

    for(const byte of bytes){

        for(let i=7;i>=0;i--){

            bits.push(
                (byte >> i) & 1
            );

        }

    }

    return bits;

}


/* ================================
   BUILD PACKET
================================ */

function buildPacket(text){

    const data = textToBytes(text);

    const packet = [];

    // START
    packet.push(0xAA);

    // LENGTH
    packet.push(data.length);

    // DATA
    for(const b of data){
        packet.push(b);
    }

    // CHECKSUM
    packet.push(checksum(data));

    // END
    packet.push(0x55);

    return new Uint8Array(packet);

}


/* ================================
   SYNC
================================ */

const SYNC_PATTERN = [
    0,1,0,1,0,1,0,1
];


/* ================================
   SEND PULSE
================================ */

function createPulse(duration){

    return new Promise(resolve => {

        if(!audioContext){

            resolve();
            return;

        }

        const osc =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        osc.type = "sine";

        osc.frequency.value = CARRIER;

        /*
        Small fade in/out.
        This prevents clicks.
        */

        const now =
            audioContext.currentTime;

        const dur =
            duration / 1000;

        gain.gain.setValueAtTime(
            0,
            now
        );

        gain.gain.linearRampToValueAtTime(
            0.8,
            now + 0.008
        );

        gain.gain.setValueAtTime(
            0.8,
            now + dur - 0.008
        );

        gain.gain.linearRampToValueAtTime(
            0,
            now + dur
        );

        osc.connect(gain);

        gain.connect(
            audioContext.destination
        );

        osc.start();

        osc.stop(
            now + dur + 0.01
        );

        setTimeout(
            resolve,
            duration
        );

    });

}


/* ================================
   SEND ONE BIT
================================ */

async function sendBit(bit){

    const duration =
        bit === 0
        ? SHORT_PULSE
        : LONG_PULSE;

    await createPulse(duration);

    await sleep(GAP);

}


/* ================================
   SEND MESSAGE
================================ */

let transmitting = false;

async function sendMessage(){

    if(transmitting){
        return;
    }

    await startAudio();

    const text =
        document.getElementById("message")
        .value;

    if(!text){

        setTX("Write something first.");
        return;

    }

    transmitting = true;

    const packet =
        buildPacket(text);

    const bits =
        bytesToBits(packet);

    txBits.textContent =
        "Bits: " + bits.join("");

    setTX(
        "Sending...\n" +
        "Message: " + text + "\n" +
        "Bytes: " + packet.length + "\n" +
        "Bits: " + bits.length
    );


    /*
    ================================
    SYNC
    ================================
    */

    for(const bit of SYNC_PATTERN){

        if(!transmitting){
            return;
        }

        await sendBit(bit);

    }


    /*
    ================================
    PACKET
    ================================
    */

    for(const bit of bits){

        if(!transmitting){
            return;
        }

        await sendBit(bit);

    }


    transmitting = false;

    setTX(
        "Transmission finished.\n" +
        "Message: " + text
    );

}


/* ================================
   STOP TX
================================ */

function stopTransmit(){

    transmitting = false;

    setTX("Transmission stopped.");

}


/* ================================
   SLEEP
================================ */

function sleep(ms){

    return new Promise(
        resolve => setTimeout(resolve,ms)
    );

}


/* =========================================================
   RECEIVER
   ========================================================= */


/* ================================
   START RECEIVER
================================ */

async function startReceiver(){

    try{

        if(receiverRunning){
            return;
        }

        receiverStream =
            await navigator.mediaDevices
            .getUserMedia({

                audio:{
                    echoCancellation:false,
                    noiseSuppression:false,
                    autoGainControl:false,
                    channelCount:1
                }

            });


        if(!audioContext){

            audioContext =
                new (window.AudioContext ||
                window.webkitAudioContext)();

        }

        if(audioContext.state === "suspended"){
            await audioContext.resume();
        }


        receiverSource =
            audioContext.createMediaStreamSource(
                receiverStream
            );


        analyser =
            audioContext.createAnalyser();

        /*
        FFT size.
        Larger = better frequency resolution.
        */

        analyser.fftSize = 4096;

        analyser.smoothingTimeConstant = 0.05;

        receiverSource.connect(
            analyser
        );


        receiverRunning = true;

        detectedPulses = [];

        syncBuffer = [];

        currentBits = [];

        receivingPacket = false;

        setRX(
            "Microphone running.\n" +
            "Listening for " +
            CARRIER +
            " Hz..."
        );

        receiverLoop =
            requestAnimationFrame(
                processMicrophone
            );


    }catch(err){

        setRX(
            "Microphone error:\n" +
            err.message
        );

    }

}


/* ================================
   STOP RECEIVER
================================ */

function stopReceiver(){

    receiverRunning = false;

    if(receiverLoop){
        cancelAnimationFrame(
            receiverLoop
        );
    }

    if(receiverStream){

        receiverStream
        .getTracks()
        .forEach(track => track.stop());

    }

    if(receiverSource){
        receiverSource.disconnect();
    }

    if(analyser){
        analyser.disconnect();
    }

    setRX("Receiver stopped.");

    meter.style.width = "0%";

}


/* ================================
   FIND FREQUENCY BIN
================================ */

function getCarrierEnergy(){

    if(!analyser){
        return 0;
    }

    const data =
        new Float32Array(
            analyser.frequencyBinCount
        );

    analyser.getFloatFrequencyData(data);

    const sampleRate =
        audioContext.sampleRate;

    const bin =
        Math.round(
            CARRIER *
            analyser.fftSize /
            sampleRate
        );


    /*
    Look around carrier frequency.
    This handles slight frequency differences.
    */

    let strongest = -Infinity;

    for(
        let i = bin - 2;
        i <= bin + 2;
        i++
    ){

        if(i < 0 || i >= data.length){
            continue;
        }

        if(data[i] > strongest){
            strongest = data[i];
        }

    }


    /*
    Convert dB-ish FFT value
    into simple 0..1 value.
    */

    if(!isFinite(strongest)){
        return 0;
    }


    const linear =
        Math.pow(
            10,
            strongest / 20
        );


    return linear;

}


/* ================================
   MICROPHONE LOOP
================================ */

function processMicrophone(){

    if(!receiverRunning){
        return;
    }


    const energy =
        getCarrierEnergy();


    /*
    Dynamic threshold.

    noiseLevel is measured during calibration.
    */

    const threshold =
        Math.max(
            noiseLevel *
            THRESHOLD_MULTIPLIER,

            0.008
        );


    const signal =
        energy > threshold;


    /*
    Visual meter
    */

    const visual =
        Math.min(
            100,
            energy * 1000
        );

    meter.style.width =
        visual + "%";


    /*
    Pulse START
    */

    if(signal && !pulseActive){

        pulseActive = true;

        pulseStart =
            performance.now();

    }


    /*
    Pulse END
    */

    if(!signal && pulseActive){

        pulseActive = false;

        const now =
            performance.now();

        const duration =
            now - pulseStart;

        /*
        Ignore extremely short noise.
        */

        if(duration > 20){

            registerPulse(duration);

        }

    }


    receiverLoop =
        requestAnimationFrame(
            processMicrophone
        );

}


/* ================================
   REGISTER PULSE
================================ */

function registerPulse(duration){

    pulseInfo.textContent =
        detectedPulses.length + 1;


    /*
    Determine whether
    pulse is SHORT or LONG.
    */

    let bit;


    if(
        Math.abs(
            duration - SHORT_PULSE
        )
        <
        Math.abs(
            duration - LONG_PULSE
        )
    ){

        bit = 0;

    }else{

        bit = 1;

    }


    detectedPulses.push({
        duration,
        bit,
        time:performance.now()
    });


    /*
    Keep latest pulses only.
    */

    if(
        detectedPulses.length > 100
    ){

        detectedPulses.shift();

    }


    setDebug(
        "Pulse detected\n" +
        "Duration: " +
        duration.toFixed(1) +
        " ms\n" +
        "Decoded: " +
        bit
    );


    processPulse(bit);

}


/* ================================
   PROCESS PULSE
================================ */

function processPulse(bit){

    /*
    First search for SYNC.
    */

    if(!receivingPacket){

        syncBuffer.push(bit);


        if(syncBuffer.length >
           SYNC_PATTERN.length){

            syncBuffer.shift();

        }


        if(arrayEquals(
            syncBuffer,
            SYNC_PATTERN
        )){

            receivingPacket = true;

            currentBits = [];

            syncBuffer = [];

            setRX(
                "SYNC FOUND!\n" +
                "Receiving packet..."
            );

        }

        return;

    }


    /*
    We are inside packet.
    */

    currentBits.push(bit);


    /*
    Packet structure:

    8 bits  START
    8 bits  LENGTH
    DATA
    8 bits CHECKSUM
    8 bits END
    */


    if(currentBits.length < 16){
        return;
    }


    /*
    Read LENGTH.
    */

    const length =
        bitsToByte(
            currentBits.slice(8,16)
        );


    /*
    Expected number of bits:

    START = 8
    LENGTH = 8
    DATA = length * 8
    CHECKSUM = 8
    END = 8
    */

    const expected =
        8 +
        8 +
        length * 8 +
        8 +
        8;


    /*
    Safety.
    */

    if(length > 200){

        resetPacket();

        return;

    }


    if(currentBits.length >= expected){

        decodePacket(
            currentBits.slice(0,expected)
        );

        resetPacket();

    }

}


/* ================================
   DECODE PACKET
================================ */

function decodePacket(bits){

    const bytes = [];


    for(
        let i = 0;
        i < bits.length;
        i += 8
    ){

        bytes.push(
            bitsToByte(
                bits.slice(i,i+8)
            )
        );

    }


    const START =
        bytes[0];

    const length =
        bytes[1];


    if(START !== 0xAA){

        setRX(
            "Bad START byte."
        );

        return;

    }


    const data =
        bytes.slice(
            2,
            2 + length
        );


    const receivedChecksum =
        bytes[2 + length];


    const END =
        bytes[3 + length];


    if(END !== 0x55){

        setRX(
            "Bad END byte."
        );

        return;

    }


    const calculated =
        checksum(data);


    if(
        calculated !==
        receivedChecksum
    ){

        setRX(
            "CHECKSUM ERROR\n" +
            "Expected: " +
            calculated +
            "\nReceived: " +
            receivedChecksum
        );

        return;

    }


    try{

        const text =
            new TextDecoder()
            .decode(
                new Uint8Array(data)
            );


        result.textContent = text;


        setRX(
            "PACKET OK!\n" +
            "Bytes: " +
            data.length +
            "\n" +
            "Message: " +
            text
        );


    }catch(err){

        setRX(
            "Text decode error."
        );

    }

}


/* ================================
   BITS -> BYTE
================================ */

function bitsToByte(bits){

    let value = 0;

    for(const bit of bits){

        value =
            (value << 1) |
            bit;

    }

    return value;

}


/* ================================
   ARRAY EQUAL
================================ */

function arrayEquals(a,b){

    if(a.length !== b.length){
        return false;
    }

    for(
        let i=0;
        i<a.length;
        i++
    ){

        if(a[i] !== b[i]){
            return false;
        }

    }

    return true;

}


/* ================================
   RESET PACKET
================================ */

function resetPacket(){

    receivingPacket = false;

    currentBits = [];

    syncBuffer = [];

    setRX(
        "Waiting for SYNC..."
    );

}


/* =========================================================
   CALIBRATION
   ========================================================= */

async function calibrate(){

    if(!receiverRunning){

        setRX(
            "Start microphone first."
        );

        return;

    }


    setRX(
        "Calibrating...\n" +
        "Keep the room silent."
    );


    let total = 0;

    const samples = 60;


    for(
        let i=0;
        i<samples;
        i++
    ){

        total += getCarrierEnergy();

        await sleep(25);

    }


    noiseLevel =
        total / samples;


    setRX(
        "Calibration finished.\n" +
        "Noise level: " +
        noiseLevel.toFixed(5) +
        "\nThreshold: " +
        Math.max(
            noiseLevel *
            THRESHOLD_MULTIPLIER,
            0.008
        ).toFixed(5)
    );

}


/* ================================
   INIT
================================ */

window.addEventListener(
    "beforeunload",
    () => {

        stopReceiver();
        stopTransmit();

    }
);

</script>

</body>
</html>
