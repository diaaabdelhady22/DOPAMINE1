<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE UCP - Chirp Protocol</title>
    <style>
        :root {
            --bg: #edf2f7;
            --panel: #f8fafc;
            --text: #14213d;
            --muted: #5b6b7f;
            --accent: #2f5f8c;
            --accent-2: #4d7aa7;
            --border: rgba(20, 33, 61, 0.16);
            --shadow: 0 16px 40px rgba(15, 23, 34, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f7f9fc 0%, #e9eef4 100%);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .app-shell { width: min(100%, 760px); }

        .container {
            position: relative;
            background: var(--panel);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 18px;
        }

        .brand-badge {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-weight: 800;
            color: #ffffff;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 8px 18px rgba(47, 95, 140, 0.18);
        }

        .brand h1 { margin: 0; font-size: 1.8rem; letter-spacing: 0.18em; }
        .brand p { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; text-align: center; }

        .mode-switch {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 18px 0 16px;
        }

        .mode-btn {
            flex: 1;
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: var(--text);
            background: #eef3f8;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #ffffff;
            border-color: transparent;
        }

        .panel { display: none; }
        .panel.active { display: block; }

        label { display: block; margin-bottom: 8px; color: var(--muted); font-weight: 700; }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: #ffffff;
            color: var(--text);
            font-size: 1rem;
            resize: vertical;
            outline: none;
        }

        .action-btn {
            margin-top: 14px;
            width: 100%;
            border: none;
            padding: 13px 16px;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: #ffffff;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
        }

        .action-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .status { color: #325d85; font-weight: 700; }

        .result-box {
            margin-top: 14px;
            min-height: 92px;
            padding: 14px;
            border-radius: 14px;
            background: #f3f6fa;
            border: 1px solid var(--border);
            color: #23415f;
            font-size: 1.05rem;
            font-weight: 700;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="app-shell">
    <div class="container">
        <div class="brand">
            <div class="brand-badge">UCP</div>
            <div>
                <h1>THE UCP</h1>
                <p>CHIRP / ACOUSTIC PACKET PROTOCOL</p>
            </div>
        </div>

        <div class="mode-switch">
            <button class="mode-btn active" id="sendModeBtn" onclick="showPanel('send')">Send Message</button>
            <button class="mode-btn" id="receiveModeBtn" onclick="showPanel('receive')">Receive Message</button>
        </div>

        <div class="panel active" id="sendPanel">
            <label for="textInput">Type your message</label>
            <textarea id="textInput" placeholder="Enter text to transmit..."></textarea>
            <button class="action-btn" id="sendBtn" onclick="transmitText()">Send</button>
        </div>

        <div class="panel" id="receivePanel">
            <div class="status-row">
                <span>Listening mode</span>
                <span class="status" id="statusText">Microphone is off</span>
            </div>
            <button class="action-btn" id="listenBtn" onclick="startListening()">Start Listening</button>
            <div class="result-box" id="receivedText"></div>
        </div>
    </div>
</div>

<script>
    // استخدام نطاق ترددات أعمق قليلاً لاستقبال متكافئ عبر كل الهواتف والميكروفونات
    const F_LOW = 15000;  // التردد الأدنى
    const F_HIGH = 18000; // التردد الأعلى
    const CHIRP_DURATION = 0.15; // 150ms لكل نزلاق تردد
    const PAUSE = 0.05; // 50ms صمت بين الحروف لمنع تداخل الصدى

    function showPanel(mode) {
        document.getElementById('sendPanel').classList.toggle('active', mode === 'send');
        document.getElementById('receivePanel').classList.toggle('active', mode === 'receive');
        document.getElementById('sendModeBtn').classList.toggle('active', mode === 'send');
        document.getElementById('receiveModeBtn').classList.toggle('active', mode === 'receive');
    }

    // إنشاء صوت Chirp (انزلاق تردد) يمثل القيمة
    function playChirp(audioCtx, startFreq, endFreq, duration) {
        return new Promise(resolve => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(endFreq, audioCtx.currentTime + duration);

            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime + 0.01);
            gain.gain.setValueAtTime(0.7, audioCtx.currentTime + duration - 0.01);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);

            setTimeout(resolve, (duration + PAUSE) * 1000);
        });
    }

    async function transmitText() {
        const text = document.getElementById('textInput').value;
        if (!text) return;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        document.getElementById('sendBtn').disabled = true;

        // 1. إرسال Header Chirp (انزلاق كامل من 14kHz لـ 19kHz)
        await playChirp(audioCtx, 14000, 19000, 0.3);

        // 2. إرسال كل حرف كنغمتين انزلاقيتين (Base-16 Chirps)
        for (let char of text) {
            let code = char.charCodeAt(0);
            let highNibble = (code >> 4) & 0x0F; // النصف الأول من البايت
            let lowNibble = code & 0x0F;        // النصف الثاني من البايت

            // تحويل النصفين لترددات انزلاقية محددة
            let f1 = F_LOW + (highNibble * 180);
            let f2 = F_LOW + (lowNibble * 180);

            await playChirp(audioCtx, f1, f1 + 250, CHIRP_DURATION);
            await playChirp(audioCtx, f2, f2 + 250, CHIRP_DURATION);
        }

        document.getElementById('sendBtn').disabled = false;
    }

    // --- المستقبل ---
    let isListening = false;
    let audioContext, analyser, stream;
    let nibblesBuffer = [];

    async function startListening() {
        if (isListening) return;

        try {
            stream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: false,
                    noiseSuppression: false,
                    autoGainControl: false
                },
                video: false
            });

            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;

            let source = audioContext.createMediaStreamSource(stream);
            source.connect(analyser);

            isListening = true;
            document.getElementById('statusText').innerText = "Listening now...";
            document.getElementById('receivedText').innerText = "";
            document.getElementById('listenBtn').disabled = true;

            processAudio();
        } catch (err) {
            alert("Please allow microphone access.");
            console.error(err);
        }
    }

    let lastDetectedTime = 0;

    function processAudio() {
        if (!isListening) return;

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(dataArray);

        let maxVal = 0;
        let maxIndex = -1;

        for (let i = 0; i < bufferLength; i++) {
            if (dataArray[i] > maxVal) {
                maxVal = dataArray[i];
                maxIndex = i;
            }
        }

        let nyquist = audioContext.sampleRate / 2;
        let freq = maxIndex * nyquist / bufferLength;
        const now = performance.now();

        // التقاط الترددات بفاصل زمني يمنع التكرار (Debounce)
        if (maxVal > 45 && freq >= F_LOW && freq <= F_HIGH + 500) {
            if (now - lastDetectedTime > (CHIRP_DURATION * 1000 * 0.7)) {
                let nibble = Math.round((freq - F_LOW) / 180);
                if (nibble >= 0 && nibble <= 15) {
                    nibblesBuffer.push(nibble);
                    lastDetectedTime = now;

                    // كل nibbles (نصفين) يشكلان حرفاً كاملاً
                    if (nibblesBuffer.length % 2 === 0) {
                        let high = nibblesBuffer[nibblesBuffer.length - 2];
                        let low = nibblesBuffer[nibblesBuffer.length - 1];
                        let charCode = (high << 4) | low;
                        
                        document.getElementById('receivedText').innerText += String.fromCharCode(charCode);
                    }
                }
            }
        }

        requestAnimationFrame(processAudio);
    }
</script>

</body>
</html>
