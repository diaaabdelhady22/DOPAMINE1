<style>
:root{--navy:#132238;--orange:#f47b20;--orange-dark:#d9630c;--bg:#f7f8fa;--white:#fff;--line:#e5e9ee;--muted:#687588;--danger:#c63d3d;--success:#16835b;--shadow:0 12px 32px rgba(20,38,61,.07)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--navy);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow-x:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer}.container{width:min(1180px,calc(100% - 36px));margin:auto}.header{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;z-index:20}.header .container{display:flex;align-items:center;justify-content:space-between}.brand img{width:130px}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700}.primary{background:var(--orange);color:#fff}.primary:hover{background:var(--orange-dark)}.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.danger{background:#fff;color:var(--danger);border:1px solid #efd5d5}.admin-main{padding:34px 0 70px}.title{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);font-weight:800}.title h1{margin:5px 0 7px;font-size:34px}.muted{color:var(--muted)}.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:18px}.tabs button{border:1px solid transparent;background:transparent;color:#566477;padding:10px 13px;border-radius:8px;font-weight:700}.tabs button:hover,.tabs button.active{background:#fff;border-color:var(--line);color:var(--navy)}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:22px;box-shadow:var(--shadow)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:16px}.section-head h2{margin:0;font-size:21px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}.stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--muted)}.stat .value{font-size:29px;font-weight:800;margin-top:7px}.actions{display:flex;gap:8px;flex-wrap:wrap}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.badge{display:inline-block;padding:5px 8px;border-radius:7px;background:#f0f3f6;font-size:11px;font-weight:800}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.field{margin-bottom:14px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #dce2e8;border-radius:8px;padding:11px 12px;background:#fff;color:var(--navy);outline:none}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#efaa74;box-shadow:0 0 0 3px rgba(244,123,32,.1)}.modal{position:fixed;inset:0;background:rgba(15,25,38,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal.open{display:flex}.modal-box{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:24px}.modal-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.modal-head h2{margin:0}.close{border:0;background:#f1f3f5;border-radius:8px;padding:7px 10px}.preview{margin-top:8px;border:1px dashed var(--line);border-radius:9px;min-height:80px;display:grid;place-items:center;overflow:hidden;color:var(--muted)}.preview img{width:100%;height:130px;object-fit:cover}.empty{padding:38px 20px;text-align:center;color:var(--muted);border:1px dashed #dce2e8;border-radius:10px}.toast{position:fixed;right:18px;bottom:18px;background:var(--navy);color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:200;font-size:13px}.toast.show{display:block}.mi{font-family:"Material Symbols Outlined";font-size:20px;line-height:1;vertical-align:middle}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}.brand{display:flex;align-items:center}.brand img{height:34px;width:auto;object-fit:contain}.hero{background:#fff;border:1px solid var(--line);border-radius:15px;padding:24px;margin-bottom:18px;box-shadow:var(--shadow)}.hero-grid{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.hero h1{margin:4px 0 8px}.hero-icon{width:58px;height:58px;border-radius:14px;background:#fff3e8;color:var(--orange);display:grid;place-items:center}.hero-icon .mi{font-size:30px}.stat{position:relative;min-height:125px}.stat-icon{width:38px;height:38px;border-radius:10px;background:#fff3e8;color:var(--orange);display:grid;place-items:center;margin-bottom:10px}.stat-icon .mi{font-size:22px}.preview{background:#fafbfc}.upload-box{border:1px dashed #cfd7df;border-radius:10px;padding:14px}.upload-box input[type=file]{width:100%}.hint{font-size:12px;color:var(--muted);margin-top:6px}.course-thumb{width:54px;height:38px;border-radius:7px;object-fit:cover;background:#eef1f4}.row-title{display:flex;align-items:center;gap:10px}.icon-btn{width:38px;height:38px;padding:0}.tabs button{display:inline-flex;align-items:center;gap:7px}@media(max-width:760px){.container{width:min(100% - 24px,1180px)}.title{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.admin-main{padding-top:24px}.tabs{overflow:auto;flex-wrap:nowrap;padding-bottom:3px}.tabs button{white-space:nowrap}}

.resource-list{display:grid;gap:10px;margin-top:14px}.resource-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border:1px solid #e6eaf0;border-radius:12px;background:#fff}.resource-info{min-width:0}.resource-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.resource-meta{font-size:12px;color:#7a8494;margin-top:4px}.resource-empty{padding:18px;text-align:center;border:1px dashed #d7dde7;border-radius:12px;color:#7a8494}.progress-wrap{margin-top:14px;background:#eef2f7;border-radius:999px;height:9px;overflow:hidden}.progress-fill{height:100%;width:0;background:var(--orange);transition:width .2s}.resource-success{color:#138a52;font-weight:700;font-size:13px;margin-top:10px}.resource-error{color:#c93636;font-weight:700;font-size:13px;margin-top:10px}
.resource-upload-card{border:1px solid #e7ebf0;border-radius:16px;padding:16px;background:#fbfcfd}.resource-name-input{margin-bottom:12px}.resource-name-input label{font-size:12px;font-weight:800;display:block;margin-bottom:7px}.resource-name-input input{width:100%;border:1px solid #dce2e8;border-radius:10px;padding:12px;background:#fff;color:var(--navy);outline:none}.resource-name-input input:focus{border-color:#efaa74;box-shadow:0 0 0 3px rgba(244,123,32,.1)}.resource-file-picker{display:flex;align-items:center;gap:10px;border:1px dashed #cbd4df;border-radius:12px;padding:10px;background:#fff;cursor:pointer}.resource-file-picker input{display:none}.resource-file-icon{width:42px;height:42px;border-radius:10px;background:#fff3e8;color:var(--orange);display:grid;place-items:center;flex:none}.resource-file-copy{min-width:0}.resource-file-copy strong{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.resource-file-copy span{display:block;font-size:11px;color:var(--muted);margin-top:2px}.resource-upload-actions{display:flex;justify-content:flex-end;margin-top:12px}.resource-item{padding:12px 13px}.resource-item .resource-name{font-size:13px}.resource-item .actions{flex:none}.resource-item .btn{padding:9px 12px}.resource-item .btn .mi{font-size:18px}@media(max-width:600px){.resource-item{align-items:flex-start;flex-direction:column}.resource-item .actions{width:100%}.resource-item .actions .btn{flex:1}.resource-upload-actions .btn{width:100%}}
</style>

<body>
<header class="header"><div class="container"><a class="brand" href="admin.html"><img src="logo.png" alt="DOPAMINE"></a><button class="btn secondary" onclick="location.href='index.html'"><span class="mi">open_in_new</span>Website</button></div></header>
<main class="admin-main"><div class="container">
<div class="title"><div><div class="eyebrow">Administration</div><h1>DOPAMINE Admin</h1><div class="muted">Simple management for students, courses, lessons and platform messages.</div></div></div>

<nav class="tabs" id="tabs"></nav><div id="content"></div>
</div></main><div id="modal" class="modal"></div><div id="toast" class="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,serverTimestamp,deleteDoc} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDD1_ssoVaIyIfwYAs7jT_g0pFdr1IlI",authDomain:"dorar-17b10.firebaseapp.com",projectId:"dorar-17b10",storageBucket:"dorar-17b10.firebasestorage.app",messagingSenderId:"740800324300",appId:"1:740800324300:web:cd819b2910a53475af5869"};
const app=initializeApp(firebaseConfig),db=getFirestore(app);
const DOCUMENT_UPLOAD_SCRIPT_URL='https://script.google.com/macros/s/AKfycbyfokYL63LhXhWWsw46X1799Jsa20i9RBMlh4fcoj_fEdbp35HoVa9S2F_I-gqfgzL3Cg/exec';
const sections=[['overview','Overview','dashboard'],['students','Students','group'],['courses','Courses','school'],['lessons','Lessons','menu_book'],['payments','Payments','payments'],['contact','Contact','contact_support']];
let active='overview';
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function id(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}
function loading(){return '<div class="panel"><div class="empty">Loading...</div></div>'}
function date(v){try{if(!v)return '—';const d=v.toDate?v.toDate():new Date(v);return isNaN(d)?'—':d.toLocaleDateString()}catch{return '—'}}
function modal(title,html){$('modal').innerHTML=`<div class="modal-box"><div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">✕</button></div>${html}</div>`;$('modal').classList.add('open')}
window.closeModal=()=>{$('modal').classList.remove('open');$('modal').innerHTML=''};
function renderTabs(){ $('tabs').innerHTML=sections.map(([k,l,i])=>`<button class="${active===k?'active':''}" onclick="load('${k}')"><span class="mi">${i}</span>${l}</button>`).join('') }
window.load=async s=>{active=s;renderTabs();$('content').innerHTML=loading();try{if(s==='overview')await overview();if(s==='students')await students();if(s==='courses')await courses();if(s==='lessons')await lessons();if(s==='payments')await payments();if(s==='contact')await contact()}catch(e){console.error(e);$('content').innerHTML='<div class="panel"><div class="empty">Something went wrong. Please try again.</div></div>'}};
async function count(name){return (await getDocs(collection(db,name))).size}
async function overview(){const [u,c]=await Promise.all([count('users'),count('courses')]);$('content').innerHTML=`<div class="grid"><div class="stat"><div class="stat-icon"><span class="mi">group</span></div><div class="label">Students</div><div class="value">${u}</div></div><div class="stat"><div class="stat-icon"><span class="mi">school</span></div><div class="label">Courses</div><div class="value">${c}</div></div><div class="stat"><div class="stat-icon"><span class="mi">menu_book</span></div><div class="label">Lessons</div><div class="value">—</div></div></div><div class="panel" style="margin-top:14px"><div class="section-head"><div><h2>Quick actions</h2><div class="muted">Open the area you need.</div></div><span class="mi">bolt</span></div><div class="actions"><button class="btn primary" onclick="load('courses')"><span class="mi">school</span>Courses</button><button class="btn secondary" onclick="load('lessons')"><span class="mi">menu_book</span><span class="mi">menu_book</span>Lessons</button><button class="btn secondary" onclick="load('students')"><span class="mi">group</span>Students</button></div></div>`}
async function students(){const snap=await getDocs(collection(db,'users'));const rows=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.role==='student');$('content').innerHTML=`<div class="panel"><div class="section-head"><div><h2>Students</h2><div class="muted">${rows.length} student account(s)</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Created</th><th></th></tr></thead><tbody>${rows.length?rows.map(u=>`<tr><td><strong>${esc(u.fullName||'—')}</strong></td><td>${esc(u.email||'—')}</td><td>${esc(u.phone||'—')}</td><td>${date(u.createdAt)}</td><td><div class="actions"><button class="btn secondary" onclick="editStudent('${encodeURIComponent(u.id)}')"><span class="mi">edit</span>Edit</button><button class="btn danger" onclick="deleteStudent('${encodeURIComponent(u.id)}')"><span class="mi">delete</span>Delete</button></div></td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">No students found.</div></td></tr>`}</tbody></table></div></div>`}
window.editStudent=async e=>{const id=decodeURIComponent(e),s=await getDoc(doc(db,'users',id));if(!s.exists())return toast('Student not found.');const u=s.data();modal('Edit Student',`<form id="student-form"><div class="form-grid"><div class="field"><label>Full Name</label><input id="sn" value="${esc(u.fullName)}" required></div><div class="field"><label>Email</label><input id="se" type="email" value="${esc(u.email)}" required></div><div class="field"><label>Phone</label><input id="sp" value="${esc(u.phone||'')}"></div></div><div class="actions"><button class="btn primary">Save</button><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button></div></form>`);$('student-form').onsubmit=async ev=>{ev.preventDefault();try{await updateDoc(doc(db,'users',id),{fullName:$('sn').value.trim(),email:$('se').value.trim().toLowerCase(),phone:$('sp').value.trim(),updatedAt:serverTimestamp()});closeModal();toast('Student updated.');load('students')}catch{toast('Could not save student.')}}}
window.deleteStudent=async e=>{if(!confirm('Delete this student account?'))return;try{await deleteDoc(doc(db,'users',decodeURIComponent(e)));toast('Student deleted.');load('students')}catch{toast('Could not delete student.')}};
async function courses(){const snap=await getDocs(collection(db,'courses'));const rows=snap.docs.map(d=>({id:d.id,...d.data()}));$('content').innerHTML=`<div class="panel"><div class="section-head"><div><h2>Courses</h2><div class="muted">Free courses open immediately. Paid courses unlock after payment approval.</div></div><button class="btn primary" onclick="newCourse()"><span class="mi">add</span>Add Course</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Course</th><th>Access</th><th>Teacher</th><th>Created</th><th></th></tr></thead><tbody>${rows.length?rows.map(c=>`<tr><td><strong>${esc(c.title||'Untitled')}</strong><br><span class="muted">${esc((c.description||'').slice(0,90))}</span></td><td><span class="badge">${c.isPaid?'Paid - '+Number(c.price||0).toFixed(2):'Free'}</span></td><td>${esc(c.teacher||'Ahmed Dorar')}</td><td>${date(c.createdAt)}</td><td><div class="actions"><button class="btn secondary" onclick="editCourse('${encodeURIComponent(c.id)}')"><span class="mi">edit</span>Edit</button><button class="btn secondary" onclick="loadLessonsFor('${encodeURIComponent(c.id)}')"><span class="mi">menu_book</span>Lessons</button><button class="btn danger" onclick="deleteCourse('${encodeURIComponent(c.id)}')"><span class="mi">delete</span>Delete</button></div></td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">No courses yet.</div></td></tr>`}</tbody></table></div></div>`}
async function compressImage(file,maxBytes=700*1024,maxDimension=1200){if(file.size<=maxBytes)return file;const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=data});let scale=Math.min(1,maxDimension/Math.max(img.width,img.height));let w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));let q=.86;for(let n=0;n<8;n++){const can=document.createElement('canvas');can.width=w;can.height=h;can.getContext('2d').drawImage(img,0,0,w,h);const blob=await new Promise(r=>can.toBlob(r,'image/jpeg',q));if(blob.size<=maxBytes)return blob;q-=.08;if(q<.45){w=Math.round(w*.85);h=Math.round(h*.85);q=.72}}return new Blob([data],{type:'image/jpeg'})}
async function fileToBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function courseForm(c={},cid=''){modal(cid?'Edit Course':'Add Course',`<form id="course-form"><div class="field"><label>Course Name</label><input id="ct" value="${esc(c.title||'')}" required></div><div class="field"><label>Description</label><textarea id="cd">${esc(c.description||'')}</textarea></div><div class="field"><label>Access Type</label><select id="cpaid"><option value="free" ${!c.isPaid?'selected':''}>Free</option><option value="paid" ${c.isPaid?'selected':''}>Paid</option></select></div><div class="field" id="price-field" style="display:${c.isPaid?'block':'none'}"><label>Amount (EGP)</label><input id="cprice" type="number" min="0" step="0.01" value="${Number(c.price)||''}"></div><div class="field full upload-box"><label>Course Image</label><input id="ci" type="file" accept="image/*"><div class="hint">Images over 1 MB are compressed before saving.</div><div id="cip" class="preview">${c.thumbnailBase64||c.thumbnailUrl?`<img src="${esc(c.thumbnailBase64||c.thumbnailUrl)}">`:'Choose an image'}</div></div><div class="actions"><button class="btn primary"><span class="mi">save</span>Save Course</button><button type="button" class="btn secondary" onclick="closeModal()"><span class="mi">close</span>Cancel</button></div></form>`);$('cpaid').onchange=()=>{$('price-field').style.display=$('cpaid').value==='paid'?'block':'none'};$('ci').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('cip').textContent='Processing image...';try{const b=await compressImage(f);$('cip').innerHTML=`<img src="${await fileToBase64(b)}">`}catch{$('cip').textContent='Could not preview image.'}};$('course-form').onsubmit=async e=>{e.preventDefault();const paid=$('cpaid').value==='paid',price=Number($('cprice').value)||0;if(paid&&price<=0)return toast('Enter a valid course amount.');const p={title:$('ct').value.trim(),description:$('cd').value.trim(),teacher:'Ahmed Dorar',published:true,isPaid:paid,price:paid?price:0,updatedAt:serverTimestamp()};try{const f=$('ci').files[0];if(f){const b=await compressImage(f);p.thumbnailBase64=await fileToBase64(b);p.thumbnailUrl=''}else{p.thumbnailBase64=c.thumbnailBase64||'';p.thumbnailUrl=c.thumbnailUrl||''}if(cid)await updateDoc(doc(db,'courses',cid),p);else{p.createdAt=serverTimestamp();await setDoc(doc(db,'courses',id()),p)}closeModal();toast('Course saved.');load('courses')}catch(err){console.error(err);toast('Could not save course.')}}}
window.newCourse=()=>courseForm();window.editCourse=async e=>{const cid=decodeURIComponent(e),s=await getDoc(doc(db,'courses',cid));if(!s.exists())return toast('Course not found.');courseForm(s.data(),cid)};
window.deleteCourse=async e=>{const cid=decodeURIComponent(e);if(!confirm('Delete this course? Its lessons must be removed separately if needed.'))return;try{await deleteDoc(doc(db,'courses',cid));toast('Course deleted.');load('courses')}catch{toast('Could not delete course.')}};
window.loadLessonsFor=e=>{active='lessons';renderTabs();lessons(decodeURIComponent(e))};
async function payments(){const settings=await getDoc(doc(db,'settings','paymentNumbers'));const numbers=settings.exists()?settings.data():{};const snap=await getDocs(collection(db,'paymentRequests'));const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>dateValue(b.createdAt)-dateValue(a.createdAt));$('content').innerHTML=`<div class="panel"><div class="section-head"><div><h2>Payment numbers</h2><div class="muted">Students see these numbers during checkout.</div></div></div><form id="payment-numbers-form"><div class="form-grid"><div class="field"><label>Vodafone Cash number</label><input id="vodafone-number" value="${esc(numbers.vodafone||'')}" placeholder="01xxxxxxxxx"></div><div class="field"><label>InstaPay address or number</label><input id="instapay-number" value="${esc(numbers.instapay||'')}" placeholder="name@instapay"></div></div><button class="btn primary">Save payment numbers</button></form></div><div class="panel" style="margin-top:14px"><div class="section-head"><div><h2>Payment requests</h2><div class="muted">Review submitted transfers and unlock courses after approval.</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Course(s)</th><th>Amount</th><th>Method</th><th>Sender</th><th>Status</th><th></th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td><strong>${esc(r.studentName||'—')}</strong><br><span class="muted">${esc(r.studentEmail||'')}</span></td><td>${esc((r.courseTitles||[]).join(', ')||'—')}</td><td>${Number(r.amount||0).toFixed(2)} EGP</td><td>${esc(r.method||'—')}</td><td>${esc(r.senderPhone||'—')}</td><td><span class="badge">${esc(r.status||'pending')}</span></td><td><div class="actions">${r.receiptBase64?`<button class="btn secondary" onclick="viewReceipt('${encodeURIComponent(r.id)}')"><span class="mi">image</span>Receipt</button>`:''}${r.status==='pending'?`<button class="btn primary" onclick="reviewPayment('${encodeURIComponent(r.id)}','approved')">Approve</button><button class="btn danger" onclick="reviewPayment('${encodeURIComponent(r.id)}','rejected')">Reject</button>`:''}</div></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty">No payment requests yet.</div></td></tr>`}</tbody></table></div></div>`;$('payment-numbers-form').onsubmit=async e=>{e.preventDefault();try{await setDoc(doc(db,'settings','paymentNumbers'),{vodafone:$('vodafone-number').value.trim(),instapay:$('instapay-number').value.trim(),updatedAt:serverTimestamp()},{merge:true});toast('Payment numbers saved.')}catch{toast('Could not save payment numbers.')}}}
function dateValue(v){try{return v?.toMillis?v.toMillis():new Date(v||0).getTime()||0}catch{return 0}}
window.viewReceipt=async e=>{const s=await getDoc(doc(db,'paymentRequests',decodeURIComponent(e)));if(!s.exists())return toast('Payment request not found.');const r=s.data();modal('Payment receipt',`<div class="receipt-view"><img src="${esc(r.receiptBase64||'')}" alt="Payment receipt"><p><strong>${esc(r.senderName||'')}</strong> - ${esc(r.senderPhone||'')}</p></div>`)};
window.reviewPayment=async(e,status)=>{const rid=decodeURIComponent(e);const reason=status==='rejected'?prompt('Reason for rejection (optional):')||'Payment could not be verified.':'';try{const s=await getDoc(doc(db,'paymentRequests',rid));if(!s.exists())return toast('Payment request not found.');const r=s.data();if(status==='approved'){for(const courseId of r.courseIds||[])await setDoc(doc(db,'enrollments',`${r.studentId}_${courseId}`),{studentId:r.studentId,courseId,status:'approved',paymentRequestId:rid,approvedAt:serverTimestamp()},{merge:true})}await updateDoc(doc(db,'paymentRequests',rid),{status,rejectionReason:reason,reviewedAt:serverTimestamp()});toast(status==='approved'?'Payment approved and course unlocked.':'Payment rejected.');load('payments')}catch(error){console.error(error);toast('Could not update the payment request.')}};
async function lessons(filter=''){const cs=(await getDocs(collection(db,'courses'))).docs.map(d=>({id:d.id,...d.data()}));const list=[];for(const c of cs){if(filter&&c.id!==filter)continue;(await getDocs(collection(db,'courses',c.id,'lessons'))).docs.forEach(d=>list.push({id:d.id,courseId:c.id,courseTitle:c.title,...d.data()}))}list.sort((a,b)=>(a.courseTitle||'').localeCompare(b.courseTitle||'')||(Number(a.order)||0)-(Number(b.order)||0));$('content').innerHTML=`<div class="panel"><div class="section-head"><div><h2>Lessons</h2><div class="muted">For each lesson, only the name, YouTube link and order are needed.</div></div><button class="btn primary" onclick="newLesson()"><span class="mi">add</span>Add Lesson</button></div>${filter?`<button class="btn secondary" style="margin-bottom:14px" onclick="load('lessons')"><span class="mi">arrow_back</span>Show all courses</button>`:''}<div class="table-wrap"><table class="table"><thead><tr><th>Lesson</th><th>Course</th><th>Order</th><th>Video</th><th></th></tr></thead><tbody>${list.length?list.map(l=>`<tr><td><strong>${esc(l.title||'Untitled Lesson')}</strong></td><td>${esc(l.courseTitle||'—')}</td><td>${Number(l.order)||1}</td><td><span class="badge">${l.videoId||l.youtubeVideoId||l.youtubeUrl?'YouTube added':'Missing'}</span></td><td><div class="actions"><button class="btn secondary" onclick="manageLessonResources('${encodeURIComponent(l.courseId)}','${encodeURIComponent(l.id)}')"><span class="mi">folder_open</span>Resources</button><button class="btn secondary" onclick="editLesson('${encodeURIComponent(l.courseId)}','${encodeURIComponent(l.id)}')"><span class="mi">edit</span>Edit</button><button class="btn danger" onclick="deleteLesson('${encodeURIComponent(l.courseId)}','${encodeURIComponent(l.id)}')"><span class="mi">delete</span>Delete</button></div></td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">No lessons yet. Create a course first, then add its lessons.</div></td></tr>`}</tbody></table></div></div>`}
function lessonForm(l={},cid='',lid=''){const cs=window._courses||[];modal(lid?'Edit Lesson':'Add Lesson',`<form id="lesson-form"><div class="field"><label>Course</label><select id="lc" required>${cs.map(c=>`<option value="${esc(c.id)}" ${c.id===(cid||l.courseId)?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div><div class="field"><label>Lesson Name</label><input id="lt" value="${esc(l.title||'')}" required></div><div class="field"><label>YouTube Link</label><input id="lv" value="${esc(l.videoId||l.youtubeVideoId||l.youtubeUrl||'')}" placeholder="Paste the YouTube link" required></div><div class="field"><label>Order</label><input id="lo" type="number" min="1" value="${Number(l.order)||1}" required></div><div class="actions"><button class="btn primary">Save Lesson</button><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button></div></form>`);$('lesson-form').onsubmit=async e=>{e.preventDefault();const newCid=$('lc').value,p={title:$('lt').value.trim(),videoId:$('lv').value.trim(),order:Number($('lo').value)||1,updatedAt:serverTimestamp()};try{let savedLid=lid;if(lid){if(newCid===cid)await updateDoc(doc(db,'courses',cid,'lessons',lid),p);else{const oldSnap=await getDoc(doc(db,'courses',cid,'lessons',lid));const oldData=oldSnap.exists()?oldSnap.data():{};await setDoc(doc(db,'courses',newCid,'lessons',lid),{...oldData,...p});await deleteDoc(doc(db,'courses',cid,'lessons',lid))}}else{savedLid=id();p.createdAt=serverTimestamp();await setDoc(doc(db,'courses',newCid,'lessons',savedLid),p)}closeModal();toast('Lesson saved.');if(!lid)manageLessonResources(encodeURIComponent(newCid),encodeURIComponent(savedLid),true);else load('lessons')}catch(error){console.error(error);toast('Could not save lesson.')}}}
window.newLesson=async()=>{window._courses=(await getDocs(collection(db,'courses'))).docs.map(d=>({id:d.id,...d.data()}));if(!window._courses.length)return toast('Create a course first.');lessonForm({},window._courses[0].id)};
window.editLesson=async(a,b)=>{const cid=decodeURIComponent(a),lid=decodeURIComponent(b);const [s,cs]=await Promise.all([getDoc(doc(db,'courses',cid,'lessons',lid)),getDocs(collection(db,'courses'))]);if(!s.exists())return toast('Lesson not found.');window._courses=cs.docs.map(d=>({id:d.id,...d.data()}));lessonForm(s.data(),cid,lid)};
window.deleteLesson=async(a,b)=>{if(!confirm('Delete this lesson?'))return;try{await deleteDoc(doc(db,'courses',decodeURIComponent(a),'lessons',decodeURIComponent(b)));toast('Lesson deleted.');load('lessons')}catch{toast('Could not delete lesson.')}};

function resourceName(file){return file?.name||'Resource'}
function resourceDirectUrl(url){if(!url)return url;const m=url.match(/\/d\/([a-zA-Z0-9_-]+)/)||url.match(/[?&]id=([a-zA-Z0-9_-]+)/);return m?`https://drive.google.com/uc?export=download&id=${m[1]}`:url}
function renderLessonResources(resources=[]){if(!resources.length)return '<div class="resource-empty">No resources added yet.</div>';return `<div class="resource-list">${resources.map((r,i)=>`<div class="resource-item"><div class="resource-info"><div class="resource-name">${esc(r.name||'Resource')}</div><div class="resource-meta">${esc(r.type||'File')} · ${r.uploadedAt?date(r.uploadedAt):'—'}</div></div><div class="actions"><button class="btn secondary" onclick="window.open('${esc(resourceDirectUrl(r.url))}','_blank')"><span class="mi">download</span>Open</button><button class="btn danger" onclick="deleteLessonResource('${encodeURIComponent(window._resourceCourseId||'')}','${encodeURIComponent(window._resourceLessonId||'')}','${encodeURIComponent(String(i))}')"><span class="mi">delete</span>Delete</button></div></div>`).join('')}</div>`}
window.manageLessonResources=async function(a,b,afterCreate=false){const cid=decodeURIComponent(a),lid=decodeURIComponent(b);const snap=await getDoc(doc(db,'courses',cid,'lessons',lid));if(!snap.exists())return toast('Lesson not found.');window._resourceCourseId=cid;window._resourceLessonId=lid;const l=snap.data(),resources=l.resources||[];modal(afterCreate?'Add Resources':'Lesson Resources',`<div><div class="muted" style="margin-bottom:14px">${esc(l.title||'Lesson')} — add and manage the files students will see inside this lesson.</div><div class="resource-upload-card"><div class="resource-name-input"><label for="lesson-resource-name">Resource name</label><input id="lesson-resource-name" type="text" placeholder="Example: Unit 1 Worksheet" maxlength="120"></div><label class="resource-file-picker" for="lesson-resource-file"><span class="resource-file-icon"><span class="mi">upload_file</span></span><span class="resource-file-copy"><strong id="lesson-resource-file-label">Choose a file</strong><span>PDF, Word, PowerPoint, images and other files</span></span><input id="lesson-resource-file" type="file"></label><div class="hint">The name above is what students will see on the platform. You can skip this step and add resources later.</div><div class="resource-upload-actions"><button id="lesson-resource-upload" class="btn primary" type="button"><span class="mi">add_circle</span>Add Resource</button></div><div id="lesson-resource-progress" class="progress-wrap" style="display:none"><div id="lesson-resource-fill" class="progress-fill"></div></div><div id="lesson-resource-status"></div></div><div id="lesson-resource-list">${renderLessonResources(resources)}</div><div class="actions" style="margin-top:16px"><button class="btn secondary" type="button" onclick="closeModal();load('lessons')">${afterCreate?'Skip':'Close'}</button></div></div>`);$('lesson-resource-file').onchange=()=>{const f=$('lesson-resource-file').files?.[0];$('lesson-resource-file-label').textContent=f?`${f.name} · ${(f.size/(1024*1024)).toFixed(2)} MB`:'Choose a file';};$('lesson-resource-upload').onclick=()=>uploadLessonResource(cid,lid);}
async function uploadLessonResource(cid,lid){const input=$('lesson-resource-file'),nameInput=$('lesson-resource-name'),file=input?.files?.[0],displayName=nameInput?.value.trim();if(!file)return toast('Choose a file first.');if(!displayName)return toast('Enter the resource name first.');const btn=$('lesson-resource-upload'),wrap=$('lesson-resource-progress'),fill=$('lesson-resource-fill'),status=$('lesson-resource-status');btn.disabled=true;wrap.style.display='block';fill.style.width='0%';status.className='';status.textContent='Preparing file...';const reader=new FileReader();reader.onprogress=e=>{if(e.lengthComputable){fill.style.width=((e.loaded/e.total)*50)+'%';status.textContent='Reading file...'}};reader.onload=async()=>{try{fill.style.width='50%';status.textContent='Uploading...';const payload={fileName:file.name,mimeType:file.type,file:reader.result.split(',')[1]};let prog=50;const timer=setInterval(()=>{if(prog<90){prog+=5;fill.style.width=prog+'%'}},300);const response=await fetch(DOCUMENT_UPLOAD_SCRIPT_URL,{method:'POST',body:JSON.stringify(payload)});clearInterval(timer);const result=await response.json();if(result.status!=='success')throw new Error(result.message||'Upload failed');const ref=doc(db,'courses',cid,'lessons',lid),snap=await getDoc(ref);if(!snap.exists())throw new Error('Lesson not found');const resources=snap.data().resources||[];resources.push({name:displayName,url:result.fileUrl,type:file.type||'File',originalName:file.name,uploadedAt:new Date().toISOString()});await updateDoc(ref,{resources});fill.style.width='100%';status.className='resource-success';status.textContent='Resource added successfully.';input.value='';nameInput.value='';$('lesson-resource-file-label').textContent='Choose a file';const fresh=await getDoc(ref);$('lesson-resource-list').innerHTML=renderLessonResources(fresh.data().resources||[]);setTimeout(()=>{status.textContent=''},1200)}catch(error){console.error(error);status.className='resource-error';status.textContent='Could not upload resource: '+error.message;btn.disabled=false}};reader.onerror=()=>{status.className='resource-error';status.textContent='Could not read the file.';btn.disabled=false};reader.readAsDataURL(file);}
window.deleteLessonResource=async function(a,b,index){const cid=decodeURIComponent(a),lid=decodeURIComponent(b),i=Number(decodeURIComponent(index));if(!confirm('Delete this resource?'))return;try{const ref=doc(db,'courses',cid,'lessons',lid),snap=await getDoc(ref);if(!snap.exists())return toast('Lesson not found.');const resources=snap.data().resources||[];if(i<0||i>=resources.length)return;resources.splice(i,1);await updateDoc(ref,{resources});toast('Resource deleted.');const fresh=await getDoc(ref);$('lesson-resource-list').innerHTML=renderLessonResources(fresh.data().resources||[])}catch(error){console.error(error);toast('Could not delete resource.')}};

async function contact(){const s=await getDoc(doc(db,'settings','contact'));const c=s.exists()?s.data():{};$('content').innerHTML=`<div class="panel"><div class="section-head"><div><h2>Contact Information</h2><div class="muted">These details are used by the public contact page.</div></div></div><form id="cf"><div class="form-grid"><div class="field"><label>Email</label><input id="ce" value="${esc(c.email||'')}"></div><div class="field"><label>Phone</label><input id="cp" value="${esc(c.phone||'')}"></div><div class="field"><label>WhatsApp</label><input id="cw" value="${esc(c.whatsapp||'')}"></div><div class="field"><label>Address</label><input id="ca" value="${esc(c.address||'')}"></div><div class="field full"><label>Message</label><textarea id="cm">${esc(c.message||'')}</textarea></div></div><button class="btn primary">Save Contact</button></form></div>`;$('cf').onsubmit=async e=>{e.preventDefault();try{await setDoc(doc(db,'settings','contact'),{email:$('ce').value.trim(),phone:$('cp').value.trim(),whatsapp:$('cw').value.trim(),address:$('ca').value.trim(),message:$('cm').value.trim(),updatedAt:serverTimestamp()},{merge:true});toast('Contact information saved.')}catch{toast('Could not save contact information.')}}}
load('overview');
</script></body></html>
